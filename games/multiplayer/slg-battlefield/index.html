<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>指挥官战场</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0e14; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  #wrap { position: relative; }
  .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px; background: rgba(11,14,20,.8); z-index: 10; }
  #joining { color: #e8ecf3; font: 15px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
  #joining button { margin-top: 10px; padding: 9px 30px; border-radius: 999px; border: 0; background: #2563eb;
    color: #fff; font: 15px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
  #banner { display: none; position: absolute; top: 66px; left: 0; right: 0; text-align: center;
    color: #fbbf24; font: 12px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; z-index: 9; }
  .rbox { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 300px; }
  .rtitle { font: 700 30px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
  .rsub { color: #8b93a7; font: 13px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
  .rtable { width: 100%; display: flex; flex-direction: column; gap: 4px; padding: 8px 4px;
    background: rgba(255,255,255,.04); border-radius: 8px; }
  .rrow { display: flex; justify-content: space-between; font: 12px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; color: #8b93a7; padding: 0 8px; }
  .rrow b { font-weight: 600; }
  .rmvp { color: #fde68a; font: 700 13px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }
  .rbox button { padding: 9px 30px; border-radius: 999px; border: 0; background: #2563eb; color: #fff;
    font: 15px -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif; }

  .rbox button:disabled { opacity: .4; }
</style>

<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="banner"></div>
  <div id="joining" class="overlay">正在加入对局…</div>
  <div id="result" class="overlay"></div>
</div>
<script>
/* =====================================================================
 * 指挥官战场 slg-battlefield —— S1 帧同步共享确定性模拟（GAMES-43）
 * 单一事实源：服务端（server/gateway/sims/slg-battlefield.js 经 require 载入本文件）
 * 与客户端（构建期内联进 index.html，设 window.SLGSim）跑同一份代码。
 * 设计事实源：docs/designs/slg-battlefield.md（GAMES-42 评审通过版）。
 *
 * 确定性纪律（设计书 §5.2，红线，QA 按此核验）：
 *   - 全整数模拟：位置/速度 milli-px（int32 范围内），HP/伤害/造价整型，
 *     CP 用 milli 单位整型（上限 200 = 200_000）；运算只有 + - * 与 >>，
 *     无 Math.random、无 Date.now、无浮点字面量进判定路径。
 *   - Q8 定点乘子：克制/技能乘数全定点（×1.5=384 ×1.75=448 ×2/3=171 ×2=512），
 *     伤害 dmg = base*multQ8>>8。
 *   - 车道制 1D 移动：单位绑定 {lane, dir, y}，每 tick y += dir*spdMilli；
 *     无 A*、无碰撞解算。横向视觉散布是渲染层的事（按 unit id 偏移）。
 *   - 索敌全序 tie-break：dist2 = (Δlane*125_000)² + Δy²（整数精确，<2^53），
 *     候选按 (dist2, entityId) 字典序取最小；AOE/遍历按 entityId 升序。
 *   - 距离平方用普通整数乘法（值域 < 3.2e11 « 2^53，IEEE754 整数精确，
 *     跨平台一致；不用 Math.imul——32 位截断会破坏距离全序）。
 *   - sim 本体零随机：seed = fnv1a32(roomId) 仅记录在 state（演出层预留），
 *     判定路径不消耗。随机只存在于 Bot 决策（brain，服务端侧消耗 rng）。
 *   - 同 tick 固定结算序（§5.2.7）：
 *     research → spawn/drop 落地 → 移动 → 医疗光环 → 普攻/AOE（攻击者 id 升序）
 *     → barrage 落弹 → 占点 → 能量/CP/积分结算 → 胜负判定。
 * ===================================================================== */
(function (root, factory) {
  const api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api; // Node（.cjs）
  root.SLGSim = api;                                                      // 浏览器内联（classic script）
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ---------- §5.6 PRNG 参考实现（与 games/_shared/common.js 逐字一致，冻结；仅 Bot 用） ---------- */
  function fnv1a32(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  /* ---------- 常量（全整数，milli-px 单位；数值表=设计书 §1/§2 抄录） ---------- */
  const SEATS = 4;
  const ROW_M = 25000;                 // 1 格 = 25px
  const LANE_M = 125000;               // 车道间距 125px
  const FIELD_H_M = 500000;            // 战场 20 行 × 25px = 500px
  const BASE_Y = { A: 19 * ROW_M + 12500, B: 12500 };        // row 19 / row 0 中心
  const DIR = { A: -1, B: 1 };                               // A 在下向上攻，B 在上向下攻
  const MAX_TICKS = 2700;               // 4.5 分钟（§1.3）
  const CP0 = 40000, CP_MAX = 200000;   // 开局 CP=40；上限 200（milli）
  const CP_BASE = 200, CP_TOWER = 100;  // 基础 2 CP/s + 每塔 1 CP/s（milli/tick）
  const E_MAX = 100, SCORE_WIN = 400;
  const BASE_HP = 1500, DTOWER_HP = 500;
  const POP_MAX = 12, SPAWN_CD = 2;     // 出兵卡冷却 2 tick（§5.1 天然限速）
  const CAP_R2 = 40000 * 40000;         // 占点半径 40px（平方）
  const CAP_MAX = 100, CAP_INF_BONUS = 2;   // inf 占点速度 ×2
  const AOE2 = 30000 * 30000;           // arty AOE 半径 30px
  const BARR_R2 = 45000 * 45000;        // barrage 半径 45px
  const BARR_DMG = 40, BARR_STAGGER = 2;    // 3 发，命中帧 0/+2/+4
  const DROP_TICKS = 15;                // 空降下落 15 tick（无敌）
  const SURGE_Q8 = 171, SURGE_MIN_INT = 4;  // 号令：interval*171>>8，下限 4

  /* ---------- 兵种 × 三阶数值表（§2.1 抄录；速度/射程/攻速三阶不变） ---------- */
  const UNITS = {
    inf:    { cn: '步兵',   costs: [20, 30, 40],    hps: [60, 85, 120],    atks: [8, 10, 14],   interval: 8,  range: 30000,  spd: 4500, cap2: true },
    razor:  { cn: '装甲车', costs: [45, 65, 85],    hps: [180, 250, 360],  atks: [16, 21, 29],  interval: 9,  range: 35000,  spd: 6000 },
    arty:   { cn: '炮兵',   costs: [70, 100, 130],  hps: [90, 125, 180],   atks: [26, 34, 47],  interval: 18, range: 120000, spd: 3200, aoe: true },
    sniper: { cn: '狙击手', costs: [60, 85, 115],   hps: [70, 100, 140],   atks: [34, 44, 61],  interval: 22, range: 150000, spd: 3800 },
    medic:  { cn: '军医',   costs: [35, 50, 65],    hps: [80, 115, 160],   atks: [0, 0, 0],     interval: 0,  range: 0,      spd: 4200, heal: [60, 80, 110], aura: 45000 },
    heavy:  { cn: '重坦克', costs: [110, 155, 210], hps: [520, 730, 1040], atks: [46, 60, 83],  interval: 15, range: 40000,  spd: 2800 },
  };
  const UNIT_CODES = ['inf', 'razor', 'arty', 'sniper', 'medic', 'heavy'];
  const isUnit = (c) => UNIT_CODES.indexOf(c) >= 0;

  /* 克制表（Q8 定点）：atk[u][v] —— inf→arty ×1.5 / razor→inf ×1.5 / arty→razor ×1.75 / sniper→inf ×2 / heavy→建筑 ×2 */
  const COUNTER = { inf: { arty: 384 }, razor: { inf: 384 }, arty: { razor: 448 }, sniper: { inf: 512 }, medic: {}, heavy: {} };
  const HEAVY_VS_BLD = 512;

  /* 指挥官技能表（§2.2；id 与输入编码一致） */
  const SKILLS = [
    { id: 0, code: 'barrage', cn: '火力覆盖', cost: 60, cd: 200, aim: true },
    { id: 1, code: 'repair', cn: '紧急维修', cost: 40, cd: 250, aim: false },
    { id: 2, code: 'drop', cn: '空降突击', cost: 70, cd: 300, aim: true },
    { id: 3, code: 'surge', cn: '集结号令', cost: 50, cd: 240, aim: false, dur: 50 },
  ];

  /* 基地升阶（§1.2 第四循环） */
  const RESEARCH = { 2: { cost: 150000, ticks: 300 }, 3: { cost: 300000, ticks: 450 } };

  const META = {
    gameId: 'slg-battlefield', title: '指挥官战场', seats: SEATS, tickMs: 100, maxTicks: MAX_TICKS,
    mode: '2v2-commander', teams: { A: [0, 2], B: [1, 3] },
    cmdInput: true,           // 离散指令输入（rooms.js 宽限沿用=静默、cmd 一次性语义）
    takeOver: 'casual',       // 断线逾时托管档（§4：casual 托管断线真人，体验友好）
    W: 375, H: 667, fieldH: 500, rows: 20, cell: 25, lanes: 3,
  };

  const teamOf = (seat) => (seat % 2 === 0 ? 'A' : 'B');
  const clamp0 = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  /* 距离平方（全序比较用；整数精确 <2^53，禁 imul——32 位截断破坏全序） */
  function laneDist2(ul, uy, tl, ty) { const dl = (ul - tl) * LANE_M, dy = uy - ty; return dl * dl + dy * dy; }

  /* ---------- 初始态（字段序固定，序列化比对用） ---------- */
  function create(seed, opts) {
    const maxTicks = (opts && Number.isInteger(opts.maxTicks) && opts.maxTicks > 0) ? opts.maxTicks : MAX_TICKS;
    const seats = [];
    for (let i = 0; i < SEATS; i++) {
      seats.push({
        seat: i, team: teamOf(i), cp: CP0, energy: 0, tier: 1,
        research: null,            // {tier, due} 研发中
        rally: [-1, -1, -1],       // 每车道集结行（-1 = 无 → 推进到敌基地）
        cd: [0, 0, 0, 0], spawnCd: 0, surgeUntil: 0,
        spawned: 0, kills: 0,      // 战报统计
      });
    }
    return {
      v: 1, seed: (seed >>> 0), tick: 0, maxTicks,
      seats, units: [], shells: [],
      bld: [                       // 建筑（id 即 tie-break 序；base 全宽 → 距离只算 Δy）
        { id: 1, kind: 'base', team: 'A', hp: BASE_HP, max: BASE_HP, y: BASE_Y.A, lane: 0 },
        { id: 2, kind: 'base', team: 'B', hp: BASE_HP, max: BASE_HP, y: BASE_Y.B, lane: 0 },
        { id: 3, kind: 'dtower', team: 'B', hp: DTOWER_HP, max: DTOWER_HP, y: 2 * ROW_M + 12500, lane: 1 },
        { id: 4, kind: 'dtower', team: 'A', hp: DTOWER_HP, max: DTOWER_HP, y: 17 * ROW_M + 12500, lane: 1 },
      ],
      towers: [                    // 信号塔（占领点，§1.1：Alpha 车道0 row6 / Bravo 车道2 row13）
        { i: 0, name: 'alpha', lane: 0, row: 6, y: 6 * ROW_M + 12500, owner: null, cap: 0 },
        { i: 1, name: 'bravo', lane: 2, row: 13, y: 13 * ROW_M + 12500, owner: null, cap: 0 },
      ],
      score: { A: 0, B: 0 }, kills: { A: 0, B: 0 },
      nextId: 100,                 // 建筑 id 1..4，单位 id 从 100 起（tie-break：同距建筑先）
    };
  }

  /* ---------- 小工具 ---------- */
  function popOf(state, seat) { let n = 0; for (let i = 0; i < state.units.length; i++) { const u = state.units[i]; if (u.seat === seat && u.hp > 0) n++; } return n; }
  function towersHeld(state, team) { let n = 0; for (let i = 0; i < state.towers.length; i++) if (state.towers[i].owner === team) n++; return n; }
  function baseOf(state, team) { for (let i = 0; i < state.bld.length; i++) { const b = state.bld[i]; if (b.kind === 'base' && b.team === team) return b; } return { hp: 0, y: BASE_Y[team] }; }

  function pushUnit(state, seat, code, lane, y, dropping) {
    const s = state.seats[seat], spec = UNITS[code], t = s.tier - 1;
    const u = {
      id: state.nextId++, seat, team: s.team, code, tier: s.tier,
      lane: lane, y: y, dir: DIR[s.team],
      hp: spec.hps[t], maxHp: spec.hps[t], atk: spec.atks[t],
      rng: spec.range, spd: spec.spd, interval: spec.interval, cd: 0,
      drop: dropping ? DROP_TICKS : 0, cost: spec.costs[t],
    };
    state.units.push(u);          // id 升序插入（nextId 单调递增，数组天然按 id 全序）
    return u;
  }

  /* 索敌：候选 = 敌方单位（非下落）+ 敌方建筑；按 (dist2, id) 字典序取最小，再验射程 */
  function findTarget(state, u) {
    let best = null, bd = 0, bid = 0;
    const units = state.units;
    for (let i = 0; i < units.length; i++) {
      const t = units[i];
      if (t.hp <= 0 || t.drop > 0 || t.team === u.team) continue;
      const d = laneDist2(u.lane, u.y, t.lane, t.y);
      if (best === null || d < bd || (d === bd && t.id < bid)) { best = t; bd = d; bid = t.id; }
    }
    const bld = state.bld;
    for (let i = 0; i < bld.length; i++) {
      const b = bld[i];
      if (b.hp <= 0 || b.team === u.team) continue;
      const dy = u.y - b.y;
      const d = b.kind === 'base' ? dy * dy : laneDist2(u.lane, u.y, b.lane, b.y);
      if (best === null || d < bd || (d === bd && b.id < bid)) { best = b; bd = d; bid = b.id; }
    }
    if (best === null || bd > u.rng * u.rng) return null;
    return best;
  }

  /* 军医：光环内有受伤友军 → 站定治疗 */
  function hurtAllyInAura(state, u) {
    const r2 = UNITS.medic.aura * UNITS.medic.aura;
    const units = state.units;
    for (let i = 0; i < units.length; i++) {
      const t = units[i];
      if (t.hp <= 0 || t.team !== u.team || t.id === u.id || t.hp >= t.maxHp) continue;
      if (laneDist2(u.lane, u.y, t.lane, t.y) <= r2) return true;
    }
    return false;
  }

  /* 号令期间攻速：interval ×2/3（Q8 171>>8 即 ×0.668，下限 4） */
  function effInterval(state, u) {
    if (state.tick < state.seats[u.seat].surgeUntil) {
      const v = (u.interval * SURGE_Q8) >> 8;
      return v < SURGE_MIN_INT ? SURGE_MIN_INT : v;
    }
    return u.interval;
  }

  /* ---------- 伤害结算（每帧每受击者聚合一条 hit 事件，§5.1） ---------- */
  function applyDmg(state, hits, tgt, dmg, bySeat) {
    if (tgt.hp <= 0 || dmg <= 0) return;
    tgt.hp -= dmg;
    if (tgt.kind) { // 建筑
      const key = 'b' + tgt.id;
      const h = hits[key];
      if (h) h.dmg += dmg;
      else hits[key] = { bld: tgt, seat: teamSeat(tgt.team), by: bySeat, dmg: dmg };
    } else {       // 单位
      const key = 'u' + tgt.id;
      const h = hits[key];
      if (h) h.dmg += dmg;
      else hits[key] = { unit: tgt, seat: tgt.seat, by: bySeat, dmg: dmg };
    }
  }
  const teamSeat = (team) => (team === 'A' ? 0 : 1); // 建筑归属席位（战报事件用，取该队首席）

  function flushHits(state, ev, hits) {
    const keys = Object.keys(hits).sort();       // 受击者 id 升序结算（AOE/遍历序固定）
    for (let i = 0; i < keys.length; i++) {
      const h = hits[keys[i]];
      if (h.unit) {
        const u = h.unit;
        ev.push({ k: 'hit', seat: u.seat, by: h.by, dmg: h.dmg });
        if (u.hp <= 0) {
          const killer = state.seats[h.by];
          if (killer && killer.team !== u.team) {   // 友伤（barrage 敌我不分）不计击杀/能量
            state.kills[killer.team]++;
            killer.kills++;
            killer.energy = clamp0(killer.energy + ((u.cost + 9) / 10 | 0), 0, E_MAX); // 击杀 +⌈造价/10⌉
          }
          ev.push({ k: 'die', seat: u.seat, by: h.by, unit: u.code });
        }
      } else {
        const b = h.bld;
        ev.push({ k: 'hit', seat: teamSeat(b.team), by: h.by, dmg: h.dmg });
        if (b.hp <= 0) {
          if (b.kind === 'base') ev.push({ k: 'basehp', seat: teamSeat(b.team), hp: 0 });
          else ev.push({ k: 'die', seat: teamSeat(b.team), by: h.by, unit: 'tower' });
        }
      }
    }
  }

  /* ---------- 指令校验（畸形=静默 noop；全部字段整数/枚举，§5.1） ---------- */
  const intIn = (v, lo, hi) => (Number.isInteger(v) && v >= lo && v <= hi) ? v : null;

  function execCmd(state, seat, cmd, ev) {
    if (!cmd || typeof cmd.k !== 'string') return;
    const s = state.seats[seat];
    if (cmd.k === 'spawn') {
      const unit = isUnit(cmd.unit) ? cmd.unit : null;
      const lane = intIn(cmd.lane, 0, 2);
      if (!unit || lane === null) return;
      const cost = UNITS[unit].costs[s.tier - 1] * 1000;
      if (s.spawnCd > 0 || s.cp < cost || popOf(state, seat) >= POP_MAX) return; // 权威帧拒绝（无事件回流）
      s.cp -= cost; s.spawnCd = SPAWN_CD; s.spawned++;
      pushUnit(state, seat, unit, lane, BASE_Y[s.team], false);
      ev.push({ k: 'spawn', seat: seat, unit: unit, lane: lane });
    } else if (cmd.k === 'skill') {
      const id = intIn(cmd.id, 0, 3);
      if (id === null) return;
      const sk = SKILLS[id];
      if (s.energy < sk.cost || s.cd[id] > 0) return;
      if (sk.aim) {
        const lane = intIn(cmd.lane, 0, 2), row = intIn(cmd.row, 0, 19);
        if (lane === null || row === null) return;
        if (id === 0) {          // barrage：3 发炮击，命中帧 0/+2/+4
          const y = row * ROW_M + 12500;
          for (let n = 0; n < 3; n++) state.shells.push({ id: state.nextId++, seat: seat, team: s.team, lane: lane, y: y, landAt: state.tick + n * BARR_STAGGER });
        } else {                 // drop：3 个当前阶 inf，中心+前后 1 格固定编队（无视 pop）
          for (let r = row - 1; r <= row + 1; r++) {
            const rr = clamp0(r, 0, 19);
            pushUnit(state, seat, 'inf', lane, rr * ROW_M + 12500, true);
          }
        }
      } else if (id === 1) {     // repair：己方基地 +250 + 全体友军 +50
        const b = baseOf(state, s.team);
        b.hp = clamp0(b.hp + 250, 0, b.max);
        ev.push({ k: 'basehp', seat: teamSeat(s.team), hp: b.hp });
        const units = state.units;
        for (let i = 0; i < units.length; i++) { const u = units[i]; if (u.seat === seat && u.hp > 0) u.hp = clamp0(u.hp + 50, 0, u.maxHp); }
      } else {                   // surge：全体友军攻速 ×2/3，持续 50 tick
        s.surgeUntil = state.tick + SKILLS[3].dur;
      }
      s.energy -= sk.cost; s.cd[id] = sk.cd;
      ev.push({ k: 'skill', seat: seat, id: id, lane: intIn(cmd.lane, 0, 2) === null ? 0 : cmd.lane, row: intIn(cmd.row, 0, 19) === null ? 0 : cmd.row });
    } else if (cmd.k === 'rally') {
      const lane = intIn(cmd.lane, 0, 2), row = intIn(cmd.row, 0, 19);
      if (lane === null || row === null) return;
      s.rally[lane] = row;       // 无事件：集结线在 state 内，客户端镜像同步
    } else if (cmd.k === 'research') {
      const tier = intIn(cmd.tier, 2, 3);
      if (tier === null || s.tier !== tier - 1 || s.research !== null) return;
      const r = RESEARCH[tier];
      if (s.cp < r.cost) return;
      s.cp -= r.cost; s.research = { tier: tier, due: state.tick + r.ticks };
      ev.push({ k: 'research', seat: seat, tier: tier, done: 0 });
    }
    /* 'noop' 与未知 k：静默 */
  }

  /* ---------- 单帧推进（inputs: {<seat>:{cmd:{…}}}；缺 cmd = noop） ---------- */
  function step(state, inputs) {
    const ev = [];
    const hits = {};
    const T = state.tick;

    /* 1) research 完成 */
    for (let i = 0; i < SEATS; i++) {
      const s = state.seats[i];
      if (s.research !== null && T >= s.research.due) {
        s.tier = s.research.tier; s.research = null;
        ev.push({ k: 'research', seat: i, tier: s.tier, done: 1 });
      }
    }

    /* 2) 指令执行（席位升序）+ 空降落地计数在移动相位 */
    for (let i = 0; i < SEATS; i++) {
      const inp = inputs[i] || inputs[String(i)];
      const cmd = inp && inp.cmd;
      if (cmd) execCmd(state, i, cmd, ev);
    }

    /* 3) 移动（id 升序）：下落倒数 → 站定判定（射程内有敌/军医有伤员）→ 车道推进（集结线/战场边界夹取） */
    const units = state.units;
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      if (u.hp <= 0) continue;
      if (u.drop > 0) { u.drop--; continue; }          // 空降下落中（无敌，不可行动）
      const hold = u.atk > 0 ? !!findTarget(state, u) : hurtAllyInAura(state, u);
      if (hold) continue;
      let ny = u.y + u.dir * u.spd;
      const rl = state.seats[u.seat].rally[u.lane];
      if (rl >= 0) { const ry = rl * ROW_M + 12500; ny = u.dir < 0 ? (ny < ry ? ry : ny) : (ny > ry ? ry : ny); }
      u.y = clamp0(ny, 0, FIELD_H_M);
    }

    /* 4) 医疗光环（每 10 tick；同光环不叠加取最高 → 先收集每单位最大治疗量再统一应用） */
    if (T % 10 === 0) {
      const healPlan = [];
      for (let i = 0; i < units.length; i++) {
        const m = units[i];
        if (m.hp <= 0 || m.code !== 'medic' || m.drop > 0) continue;
        const amt = UNITS.medic.heal[m.tier - 1];
        const r2 = UNITS.medic.aura * UNITS.medic.aura;
        for (let j = 0; j < units.length; j++) {
          const t = units[j];
          if (t.hp <= 0 || t.team !== m.team || t.id === m.id || t.hp >= t.maxHp) continue;
          if (laneDist2(m.lane, m.y, t.lane, t.y) <= r2) healPlan.push({ id: t.id, amt: amt }); // id 升序遍历
        }
      }
      if (healPlan.length) {
        const best = {};                                    // 单位 id → 最大治疗量（同光环不叠加取最高）
        for (let i = 0; i < healPlan.length; i++) { const h = healPlan[i]; if (!best[h.id] || best[h.id] < h.amt) best[h.id] = h.amt; }
        const ids = Object.keys(best).sort();               // 结算序固定（id 升序）
        for (let i = 0; i < ids.length; i++) {
          const want = Number(ids[i]), amt = best[ids[i]];
          for (let j = 0; j < units.length; j++) if (units[j].id === want) { units[j].hp = clamp0(units[j].hp + amt, 0, units[j].maxHp); break; }
        }
      }
    }

    /* 5) 普攻/AOE（攻击者 id 升序；阵亡者即时退出后续目标候选） */
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      if (u.hp <= 0 || u.drop > 0 || u.atk <= 0) continue;
      if (u.cd > 0) { u.cd--; continue; }
      const tgt = findTarget(state, u);
      if (!tgt) continue;
      const mult = tgt.kind ? (u.code === 'heavy' ? HEAVY_VS_BLD : 256) : (COUNTER[u.code][tgt.code] || 256);
      const dmg = (u.atk * mult) >> 8;
      applyDmg(state, hits, tgt, dmg, u.seat);
      if (UNITS[u.code].aoe && !tgt.kind) {                // arty AOE：目标点半径 30px 敌军全额伤害
        for (let j = 0; j < units.length; j++) {
          const o = units[j];
          if (o.hp <= 0 || o.team === u.team || o.id === tgt.id || o.drop > 0) continue;
          if (laneDist2(tgt.lane, tgt.y, o.lane, o.y) <= AOE2) applyDmg(state, hits, o, dmg, u.seat);
        }
      }
      u.cd = effInterval(state, u);
    }

    /* 6) barrage 落弹（敌我不分；按 shell id 升序=创建序） */
    if (state.shells.length) {
      const live = [];
      for (let i = 0; i < state.shells.length; i++) {
        const sh = state.shells[i];
        if (sh.landAt > T) { live.push(sh); continue; }
        for (let j = 0; j < units.length; j++) {
          const o = units[j];
          if (o.hp <= 0 || o.drop > 0) continue;
          if (laneDist2(sh.lane, sh.y, o.lane, o.y) <= BARR_R2) applyDmg(state, hits, o, BARR_DMG, sh.seat);
        }
      }
      state.shells = live;
    }

    /* 7) 占点（tower i 升序；同半径仅单队在场才推进，inf ×2；被夺方先衰减到 0 归中立） */
    for (let ti = 0; ti < state.towers.length; ti++) {
      const tw = state.towers[ti];
      let a = 0, b = 0, aSeat = -1, bSeat = -1;
      for (let i = 0; i < units.length; i++) {
        const u = units[i];
        if (u.hp <= 0 || u.drop > 0) continue;
        if (laneDist2(tw.lane, tw.y, u.lane, u.y) > CAP_R2) continue;
        const w = u.code === 'inf' ? CAP_INF_BONUS : 1;
        if (u.team === 'A') { a += w; if (aSeat < 0) aSeat = u.seat; }
        else { b += w; if (bSeat < 0) bSeat = u.seat; }
      }
      let changed = false, completed = -1;
      if (a > 0 && b === 0) {
        if (tw.owner === 'B') { tw.cap -= a; if (tw.cap <= 0) { tw.cap = 0; tw.owner = null; } changed = true; }
        else if (tw.owner !== 'A') { tw.cap += a; if (tw.cap >= CAP_MAX) { tw.cap = CAP_MAX; tw.owner = 'A'; completed = aSeat; } changed = true; }
      } else if (b > 0 && a === 0) {
        if (tw.owner === 'A') { tw.cap -= b; if (tw.cap <= 0) { tw.cap = 0; tw.owner = null; } changed = true; }
        else if (tw.owner !== 'B') { tw.cap += b; if (tw.cap >= CAP_MAX) { tw.cap = CAP_MAX; tw.owner = 'B'; completed = bSeat; } changed = true; }
      }
      if (completed >= 0) {
        const s = state.seats[completed];
        s.energy = clamp0(s.energy + 15, 0, E_MAX);        // 占点完成 +15（§1.2）
        state.score[s.team] += 0;                            // 分数在相位 8 按持有结转
      }
      if (changed) ev.push({ k: 'cap', tower: tw.i, alpha: tw.cap, owner: tw.owner, capTeam: tw.owner || (a > 0 && b === 0 ? 'A' : b > 0 ? 'B' : null) });
    }

    /* 8) 能量/CP/积分结算 */
    for (let i = 0; i < SEATS; i++) {
      const s = state.seats[i];
      s.cp = clamp0(s.cp + CP_BASE + CP_TOWER * towersHeld(state, s.team), 0, CP_MAX);
      if (s.spawnCd > 0) s.spawnCd--;
      for (let c = 0; c < 4; c++) if (s.cd[c] > 0) s.cd[c]--;
    }
    if ((T + 1) % 10 === 0) {
      for (let i = 0; i < SEATS; i++) { const s = state.seats[i]; s.energy = clamp0(s.energy + 1, 0, E_MAX); } // 自然 +1/s
      state.score.A += 2 * towersHeld(state, 'A');          // 每守信号塔每秒 +2 分（§1.3）
      state.score.B += 2 * towersHeld(state, 'B');
    }

    /* 清扫阵亡（保序 filter；events 已在 flushHits 结算） */
    flushHits(state, ev, hits);
    if (units.some((u) => u.hp <= 0)) state.units = units.filter((u) => u.hp > 0);
    state.bld = state.bld.filter((b) => b.hp > 0);

    state.tick = T + 1;

    /* 9) 胜负判定（双通道先到者胜，§1.3） */
    const baseA = state.bld.find((b) => b.kind === 'base' && b.team === 'A');
    const baseB = state.bld.find((b) => b.kind === 'base' && b.team === 'B');
    const deadA = !baseA, deadB = !baseB;
    if (deadA || deadB) {
      return { events: ev, over: true, result: { winner: deadA && deadB ? 'draw' : (deadA ? 'B' : 'A'), scores: { ...state.score }, kills: { ...state.kills }, reason: 'eliminated' } };
    }
    if (state.score.A >= SCORE_WIN || state.score.B >= SCORE_WIN) {
      const w = state.score.A === state.score.B ? 'draw' : (state.score.A > state.score.B ? 'A' : 'B');
      return { events: ev, over: true, result: { winner: w, scores: { ...state.score }, kills: { ...state.kills }, reason: 'score' } };
    }
    if (state.tick >= state.maxTicks) {
      let w;
      if (state.score.A !== state.score.B) w = state.score.A > state.score.B ? 'A' : 'B';
      else {
        const hpA = baseA.hp, hpB = baseB.hp;              // 平局比基地 HP 百分比（双方上限同为 1500）
        w = hpA === hpB ? 'draw' : (hpA > hpB ? 'A' : 'B');
      }
      return { events: ev, over: true, result: { winner: w, scores: { ...state.score }, kills: { ...state.kills }, reason: 'timeout' } };
    }
    return { events: ev, over: false };
  }

  const serialize = (state) => JSON.stringify(state);
  const deserialize = (json) => JSON.parse(json);

  /* =====================================================================
   * Bot 决策 brain(state, seat, level, rng, env?) → {cmd:{…}}
   * 三档策略底座=设计书 §4（含 GAMES-45 F1/F2 修正）；GAMES-46 在其上叠人格层。
   * rng 由调用方持有（服务端每 bot 一个 mulberry32，seed 派生；离线模式客户端
   * 自持）。决策记忆存 WeakMap（键=state 对象，不入模拟状态、不入帧协议——
   * 服务端侧消耗，客户端只回放输入，不破坏确定性）。
   * env（GAMES-46 新增，可选）：{kinds:[…席位 kind…]}——网关/离线端把房间名册
   * 透传给 brain（陪玩模式判定"同队是否有真人"用）；纯 bot 局可缺省。
   *
   * ── 三档人格（GAMES-46；超越参数表的"像人"差异，行为清单）─────────────
   * casual 慢节奏陪玩 · 人设：偶尔想赢一下的新手导师
   *   □ 开局延后 15s 观察（FIRST=150）；出兵保守（攒 2× 造价，F1 闸门夹上限）
   *   □ 走神窗口：每决策 15% 概率发呆 1.2-2s（不出兵不放技能）——明显失误，
   *     给对手留下可乘之窗（人格核心：休闲局该有喘息）
   *   □ 温和回击：基地被打后 5s 内 60% 概率回敬 1 个 inf 到威胁车道——
   *     点到为止，不升级响应（"被打后温和回击"）
   *   □ 陪玩模式（同队真人，env.kinds）：真人活跃 → 让位（3× 闸门/pop≤4/
   *     己方 1/3 守势集结/不放抢头技能，基地<40% 才维修）；真人挂机>15s →
   *     接管节奏（恢复正常 casual + 集结线顶到中线带推）
   *   □ 开局树 ×2（rng 定桩）：C0 懒散混编（随机兵随机道）｜C1 慢热占塔
   *     （首兵 inf 走最近塔道 + 一次性塔位集结）
   * balanced 标准节奏 · 人设：打法正经的普通玩家
   *   □ 标准节奏：2×inf 试探 → inf→razor→arty 轮换、两车道轮换、前线 1/2 集结
   *   □ 技能规矩：repair<60%、barrage 集群≥4、surge ≥6 单位推家才放
   *   □ 开局树 ×2：B0 中路试探（inf 起手轮换、左侧道起）｜B1 双线占塔
   *     （razor 起手轮换、右侧道起、开局即双塔道集结塔位）
   * competitive 快开竞技 · 人设：读你套路的排位对手
   *   □ 快开（tick 8 首动）+ 克制针对（敌众数→克制兵）+ 克制储蓄窗口（F2b）
   *   □ 集火残血：barrage 目标评分 = 集群数 + 2×残血数（hp≤40%），残血≥2
   *     即使集群<4 也打——收头优先于覆盖（"集火残血"）
   *   □ 守塔换位：己方持有塔 2.5 行内出现敌军 → 出兵道让位协防 + 集结线
   *     收到塔位（防守换位优先于扩张）；基地 5 行压顶直援（F2 保留）
   *   □ 猎杀让力（动态 mercy，game.json 可调）：己队分差 ≥ triggerGap →
   *     整档收力至均衡水平（决策放缓/技能收敛/不再 drop 断线），分差回落
   *     ≤ releaseGap 才恢复（滞回带防抖）——对局观感"势均力敌"
   *   □ 开局树 ×2：P0 快攻抢塔（首兵驻最近塔 + drop 抢点）｜P1 中路压制
   *     （3×inf 直推中路、无开局 rally、drop 前期只断兵线不抢塔）
   * ===================================================================== */
  const FIRST = { casual: 150, balanced: 30, competitive: 8 };      // 首行动 tick
  const DECIDE = { casual: 50, balanced: 20, competitive: 10 };     // 决策间隔
  const SAVE_WIN = 300;                                             // F2：competitive 克制储蓄窗口上限（tick）
  const OPENERS = { casual: 2, balanced: 2, competitive: 2 };       // GAMES-46：开局树数（按 rng 定桩派发）
  const NOOP = { cmd: { k: 'noop' } };

  /* ---------- Bot 调参（GAMES-46）：game.json net.botTuning 是可调事实源，
   * 此处内置同值默认（离线端无 game.json 读取链路时兜底）；服务端适配器
   * （server/gateway/sims/slg-battlefield.js）启动时以 game.json 覆盖。 ---------- */
  const BOT_TUNING = {
    mercy: { triggerGap: 150, releaseGap: 75, level: 'balanced' },  // 猎杀让力：分差≥150 收力至均衡档，≤75 解除（滞回）
    carry: { idleTicks: 150 },                                      // 陪玩：同队真人静默超 150 tick（15s）→ casual bot 接管
  };
  function setBotTuning(t) {
    if (!t || typeof t !== 'object') return;
    if (t.mercy && typeof t.mercy === 'object') {
      if (Number.isInteger(t.mercy.triggerGap)) BOT_TUNING.mercy.triggerGap = t.mercy.triggerGap;
      if (Number.isInteger(t.mercy.releaseGap)) BOT_TUNING.mercy.releaseGap = t.mercy.releaseGap;
      if (LEVELS.indexOf(t.mercy.level) >= 0) BOT_TUNING.mercy.level = t.mercy.level;
    }
    if (t.carry && typeof t.carry === 'object' && Number.isInteger(t.carry.idleTicks)) {
      BOT_TUNING.carry.idleTicks = t.carry.idleTicks;
    }
  }

  const botMem = new WeakMap();
  function memOf(state, seat) {
    let m = botMem.get(state);
    if (!m) { m = {}; botMem.set(state, m); }
    let s = m[seat];
    if (!s) {
      s = { lastDecide: -1, seenTick: -1, seen: new Set(), enemyLog: [], wanted: null,
            rot: 0, laneFlip: 0, openerInf: 0, openerRallied: false, towerHad: [null, null],
            retowerUntil: -1, retowerIdx: -1, rallySet: [false, false, false], lastRallyRow: [-9, -9, -9],
            saveFor: null, saveSince: -1, saveSpawned: -1,
            /* GAMES-46 人格层：开局树定桩 / 走神窗口 / 温和回击 / 陪玩 / 让力 */
            opener: -1, blurUntil: -1, baseHpLast: -1, provokedAt: -1,
            mateSnap: -1, mateActiveTick: 0, carryRally: [false, false, false], pushRally: [false, false, false],
            mercy: 0 };
      m[seat] = s;
    }
    return s;
  }

  /* 敌方最近出兵情报（每次 brain 调用增量登记，服务端视角信息） */
  function trackEnemy(state, seat, mem) {
    if (mem.seenTick === state.tick) return;
    mem.seenTick = state.tick;
    const my = teamOf(seat);
    for (let i = 0; i < state.units.length; i++) {
      const u = state.units[i];
      if (u.team === my || mem.seen.has(u.id)) continue;
      mem.seen.add(u.id);
      mem.enemyLog.push(u.code);
      if (mem.enemyLog.length > 8) mem.enemyLog.shift();
    }
  }

  /* 最近 n 次敌方出兵众数 */
  function enemyMode(mem, n) {
    const log = mem.enemyLog.slice(-n);
    const cnt = {};
    let best = null, bn = 0;
    for (let i = 0; i < log.length; i++) { cnt[log[i]] = (cnt[log[i]] || 0) + 1; if (cnt[log[i]] > bn) { bn = cnt[log[i]]; best = log[i]; } }
    return best;
  }

  /* 克制选择：inf↔razor↔arty 三角、多 sniper→razor、多 heavy→arty（§4） */
  const COUNTER_PICK = { inf: 'razor', razor: 'arty', arty: 'inf', sniper: 'razor', heavy: 'arty', medic: 'razor' };
  const TIER_PICK = ['inf', 'razor', 'heavy'];   // 无情报 → 按己方科技阶最优性价比

  /* 敌方集群：最大同车道 45px 窗（barrage 口径） */
  function bestCluster(state, enemyTeam) {
    let best = null;
    const units = state.units, r2 = BARR_R2;
    for (let i = 0; i < units.length; i++) {
      const e = units[i];
      if (e.hp <= 0 || e.drop > 0 || e.team !== enemyTeam) continue;
      let c = 0;
      for (let j = 0; j < units.length; j++) {
        const o = units[j];
        if (o.hp <= 0 || o.drop > 0 || o.team !== enemyTeam) continue;
        if (laneDist2(e.lane, e.y, o.lane, o.y) <= r2) c++;
      }
      if (!best || c > best.count) best = { lane: e.lane, y: e.y, count: c };
    }
    return best;
  }

  function weakestLane(state, enemyTeam) {
    const cnt = [0, 0, 0];
    for (let i = 0; i < state.units.length; i++) { const u = state.units[i]; if (u.hp > 0 && u.drop === 0 && u.team === enemyTeam) cnt[u.lane]++; }
    let min = cnt[0] + cnt[1] + cnt[2] + 1;
    for (let l = 0; l < 3; l++) if (cnt[l] < min) min = cnt[l];
    if (cnt[1] === min) return 1;          // 平手偏好中车道（推家最短路径旁有塔，权衡取中）
    if (cnt[0] === min) return 0;
    return 2;
  }

  /* 集火残血（GAMES-46 competitive 人格）：在 45px 集群口径上加权残血——
     评分 = 集群数 + 2×残血数（hp≤40% 上限），收头优先于覆盖；全平取先遇者（id 序稳定） */
  function focusCluster(state, enemyTeam) {
    let best = null;
    const units = state.units, r2 = BARR_R2;
    for (let i = 0; i < units.length; i++) {
      const e = units[i];
      if (e.hp <= 0 || e.drop > 0 || e.team !== enemyTeam) continue;
      let c = 0, w = 0;
      for (let j = 0; j < units.length; j++) {
        const o = units[j];
        if (o.hp <= 0 || o.drop > 0 || o.team !== enemyTeam) continue;
        if (laneDist2(e.lane, e.y, o.lane, o.y) <= r2) { c++; if (o.hp * 5 <= o.maxHp * 2) w++; }
      }
      const sc = c + 2 * w;
      if (!best || sc > best.sc) best = { lane: e.lane, y: e.y, count: c, wounded: w, sc: sc };
    }
    return best;
  }

  /* 最近威胁车道（casual 温和回击用）：距己方基地最近的敌军所在车道 */
  function threatLaneNear(state, team, base) {
    let best = -1, bd = 0;
    const units = state.units;
    for (let i = 0; i < units.length; i++) {
      const u = units[i];
      if (u.hp <= 0 || u.drop > 0 || u.team === team) continue;
      const d = laneDist2(u.lane, u.y, 0, base.y);
      if (best < 0 || d < bd) { best = u.lane; bd = d; }
    }
    return best < 0 ? 1 : best;
  }

  /* 守塔换位（GAMES-46 competitive 人格）：己方持有塔 2.5 行内出现敌军 → 该塔下标（无则 -1） */
  function guardedTower(state, my, foe) {
    for (let ti = 0; ti < state.towers.length; ti++) {
      const tw = state.towers[ti];
      if (tw.owner !== my) continue;
      for (let i = 0; i < state.units.length; i++) {
        const u = state.units[i];
        if (u.hp <= 0 || u.drop > 0 || u.team !== foe) continue;
        if (u.lane === tw.lane && Math.abs(u.y - tw.y) <= 2 * ROW_M + 12500) return ti;
      }
    }
    return -1;
  }

  function canCast(state, seat, id) {
    const s = state.seats[seat];
    return s.energy >= SKILLS[id].cost && s.cd[id] <= 0;
  }

  function affordable(state, seat, code) {
    const s = state.seats[seat];
    return s.cp >= UNITS[code].costs[s.tier - 1] * 1000;
  }

  function popOfSeat(state, seat) { return popOf(state, seat); }

  const myBaseRow = (team) => (team === 'A' ? 19 : 0);
  const enemyBaseRow = (team) => (team === 'A' ? 0 : 19);
  const rowOf = (y) => clamp0((y / ROW_M) | 0, 0, 19);

  function brain(state, seat, level, rng, env) {
    const s = state.seats[seat];
    if (!s) return NOOP;
    const mem = memOf(state, seat);
    trackEnemy(state, seat, mem);

    const my = s.team, foe = my === 'A' ? 'B' : 'A';

    /* ---- 猎杀让力（GAMES-46，game.json net.botTuning.mercy 可调）：competitive 己队
       分差 ≥ triggerGap → 整档收力至 BOT_TUNING.mercy.level（均衡档水平：决策放缓/
       技能收敛/无 drop 断线/研究节奏全套降档），分差回落 ≤ releaseGap 才恢复（滞回防抖）。
       置于节奏闸门之前——决策间隔随收力档同步放缓，是"势均力敌"观感的一部分。
       纯分差函数（state.score），确定性红线不破；让力触发次数可由分差时间线精确重构。 */
    let lvl = level;
    if (lvl === 'competitive' && BOT_TUNING.mercy.level !== 'competitive') {
      const gap = state.score[my] - state.score[foe];
      if (!mem.mercy) { if (gap >= BOT_TUNING.mercy.triggerGap) mem.mercy = 1; }
      else if (gap <= BOT_TUNING.mercy.releaseGap) mem.mercy = 0;
      if (mem.mercy) lvl = BOT_TUNING.mercy.level;
    }

    if (mem.lastDecide < 0) { if (state.tick < FIRST[lvl]) return NOOP; mem.lastDecide = state.tick; }
    else if (state.tick - mem.lastDecide < DECIDE[lvl]) return NOOP;
    mem.lastDecide = state.tick;

    /* ---- 开局树定桩（GAMES-46）：首个决策 tick 一次性 rng 派发。服务端 botRng 由房间
       seed 派生（rooms.js：mulberry32(seed ^ seat·φ)）→ 同 seed 同局必同树、同 seed
       双跑逐字节一致；分支选择由服务端 rng 承载，客户端只回放输入——确定性红线不破。 */
    if (mem.opener < 0) mem.opener = (rng() * OPENERS[lvl]) | 0;

    const myBase = baseOf(state, my);

    /* ---- 陪玩模式（GAMES-46）：同队真人（env.kinds[seat^2]==='human'）的 casual bot
       「带躺但不抢戏」。活跃检测纯 state 派生（队友 spawned/kills/tier/research/rally
       快照变化即活跃）；静默超 carry.idleTicks → 接管节奏，活跃 → 让位让资源让击杀。 */
    let carry = 0;                                   // 0=非陪玩 1=让位（真人活跃） 2=接管（真人挂机）
    if (lvl === 'casual' && env && env.kinds && env.kinds[seat ^ 2] === 'human') {
      const m = state.seats[seat ^ 2];               // 2v2 队友席（0↔2 / 1↔3）
      if (m) {
        const snap = m.spawned * 100000 + m.kills * 1000 + m.tier * 100 + (m.research ? 50 : 0) + m.rally[0] + m.rally[1] * 20 + m.rally[2] * 400;
        if (snap !== mem.mateSnap) { mem.mateSnap = snap; mem.mateActiveTick = state.tick; }
        carry = (state.tick - mem.mateActiveTick > BOT_TUNING.carry.idleTicks) ? 2 : 1;
      }
    }
    if (carry === 1) {
      /* 让位期（真人活跃）：维修只在基地 <40%（保命底线）；出兵 3× 闸门 + pop≤4——
         少花钱少占场，资源与击杀让给真人；集结钉己方 1/3 守势线（不前压不抢线）；
         barrage/surge（抢头/抢节奏技能）全让。 */
      if (myBase.hp < 600 && canCast(state, seat, 1)) return { cmd: { k: 'skill', id: 1 } };
      if (!mem.wanted) mem.wanted = UNIT_CODES[(rng() * 6) | 0];
      const cost3 = UNITS[mem.wanted].costs[s.tier - 1] * 1000;
      if (s.cp >= Math.min(cost3 * 3, CP_MAX - 1000) && popOfSeat(state, seat) < 4) {
        const u = mem.wanted; mem.wanted = null;
        return { cmd: { k: 'spawn', unit: u, lane: (rng() * 3) | 0 } };
      }
      const holdRow = my === 'A' ? 14 : 5;
      for (let l = 0; l < 3; l++) {
        if (!mem.carryRally[l]) { mem.carryRally[l] = true; mem.lastRallyRow[l] = holdRow; return { cmd: { k: 'rally', lane: l, row: holdRow } }; }
      }
      return NOOP;
    }

    /* ---- C1 慢热占塔开局（GAMES-46）：一次性把最近塔道集结钉到塔位（开局树指纹之一） */
    if (lvl === 'casual' && mem.opener === 1 && !mem.openerRallied) {
      mem.openerRallied = true;
      const tw = state.towers[my === 'A' ? 1 : 0];
      mem.lastRallyRow[tw.lane] = tw.row;
      return { cmd: { k: 'rally', lane: tw.lane, row: tw.row } };
    }

    /* ---- casual 走神窗口（GAMES-46 人格）：15% 概率发呆 1.2-2s——明显失误给对手
       留可乘之窗。纯 bot 局（carry=0）照常人格化；陪玩接管期（carry=2）认真带躺不走神 */
    if (lvl === 'casual' && carry === 0) {
      if (mem.blurUntil > state.tick) return NOOP;
      if (rng() < 0.15) { mem.blurUntil = state.tick + 120 + ((rng() * 80) | 0); return NOOP; }
    }
    /* ---- casual 温和回击记账（GAMES-46 人格）：基地 HP 下降 → 记最近受击 tick（回击在出兵段） */
    if (lvl === 'casual') {
      if (mem.baseHpLast < 0) mem.baseHpLast = myBase.hp;
      if (myBase.hp < mem.baseHpLast) mem.provokedAt = state.tick;
      mem.baseHpLast = myBase.hp;
    }

    /* ---- 技能战术（三档差异主战场） ---- */
    if (lvl === 'casual') {
      // 有能量+冷却好 30% 概率随机放（barrage 常放空）
      if (rng() < 0.3) {
        const ids = [];
        for (let i = 0; i < 4; i++) if (canCast(state, seat, i)) ids.push(i);
        if (ids.length) {
          const id = ids[(rng() * ids.length) | 0];
          if (id === 0 || id === 2) return { cmd: { k: 'skill', id: id, lane: (rng() * 3) | 0, row: (rng() * 20) | 0 } };
          return { cmd: { k: 'skill', id: id } };
        }
      }
    } else if (lvl === 'balanced') {
      if (myBase.hp < 900 && canCast(state, seat, 1)) return { cmd: { k: 'skill', id: 1 } };                    // repair：基地 <60%
      const cl = bestCluster(state, foe);
      if (cl && cl.count >= 4 && canCast(state, seat, 0)) return { cmd: { k: 'skill', id: 0, lane: cl.lane, row: rowOf(cl.y) } }; // barrage：敌集群 ≥4
      let pushing = false;
      let own = 0;
      for (let i = 0; i < state.units.length; i++) { const u = state.units[i]; if (u.seat === seat && u.hp > 0) { own++; if (Math.abs(u.y - baseOf(state, foe).y) < 150000) pushing = true; } }
      if (pushing && own >= 6 && canCast(state, seat, 3)) return { cmd: { k: 'skill', id: 3 } };                 // surge：≥6 单位推家
    } else { // competitive
      if (myBase.hp < 1125 && canCast(state, seat, 1)) return { cmd: { k: 'skill', id: 1 } };                   // repair：<75% 即用
      let foeSurge = false;
      for (let i = 0; i < state.seats.length; i++) if (state.seats[i].team === foe && state.tick < state.seats[i].surgeUntil) foeSurge = true;
      /* 集火残血（GAMES-46 人格）：目标评分 = 集群数 + 2×残血数（hp≤40%），残血 ≥2
         即使集群 <4 也打——收头优先于覆盖 */
      const cl = focusCluster(state, foe);
      if (canCast(state, seat, 0) && ((cl && (cl.count >= 4 || cl.wounded >= 2)) || foeSurge)) {
        const tgt = cl || { lane: 1, y: baseOf(state, my).y + (my === 'A' ? -125000 : 125000) };
        return { cmd: { k: 'skill', id: 0, lane: tgt.lane, row: rowOf(tgt.y) } };                                // barrage：集群 ≥4 / 残血 ≥2 / 敌 surge 期间
      }
      if (canCast(state, seat, 2)) {                                                                            // drop：抢点/断兵线
        for (let ti = 0; ti < state.towers.length; ti++) {
          const tw = state.towers[ti];
          if (tw.owner === my) continue;
          let near = 0;
          for (let i = 0; i < state.units.length; i++) { const u = state.units[i]; if (u.seat === seat && u.hp > 0 && laneDist2(tw.lane, tw.y, u.lane, u.y) <= CAP_R2) near++; }
          /* P1 中路压制开局树（GAMES-46）：开局不走 drop 抢塔（那是 P0 的侵略指纹），
             前期只留给断兵线 drop；被夺反攻照旧 */
          if (near === 0 && ((state.tick < 400 && mem.opener === 0) || tw.owner === foe)) return { cmd: { k: 'skill', id: 2, lane: tw.lane, row: tw.row } }; // 抢点（前期/被夺反攻）
        }
        if (state.tick > 200 && state.tick % 100 === 0 && popOfSeat(state, seat) < POP_MAX) {                     // 断兵线：砸敌基地门口
          const eb = baseOf(state, foe);
          return { cmd: { k: 'skill', id: 2, lane: weakestLane(state, foe), row: clamp0(enemyBaseRow(my) + (my === 'A' ? 2 : -2), 0, 19) } };
        }
      }
      let pushing = false, own = 0;
      for (let i = 0; i < state.units.length; i++) { const u = state.units[i]; if (u.seat === seat && u.hp > 0) { own++; if (Math.abs(u.y - baseOf(state, foe).y) < 150000) pushing = true; } }
      if (pushing && own >= 6 && canCast(state, seat, 3)) return { cmd: { k: 'skill', id: 3 } };
    }

    /* ---- 研究（攒钱闸门：档位阈值后停止出兵直至凑够研发费，防"有 CP 即花"永不升阶；
       让力期 lvl=balanced → 研究节奏随之降档（tick 600 起，不再 tick 400 抢升） ---- */
    let saving = 0;
    if (lvl === 'balanced') {
      if (state.tick >= 600 && s.tier === 1 && !s.research) {
        if (s.cp >= RESEARCH[2].cost) return { cmd: { k: 'research', tier: 2 } };
        saving = 2;
      }
    } else if (lvl === 'competitive') {
      if (s.tier === 1 && state.tick >= 400 && !s.research) {
        if (s.cp >= RESEARCH[2].cost) return { cmd: { k: 'research', tier: 2 } };
        /* F2 补（GAMES-45）：敌方众数非 inf（razor/arty/heavy 压场）时 T2 储蓄让位——
           被克制压制期零出兵攒 150CP ≈ 整段战线白给（razor 铺场探针：恰逢储蓄窗被拆家），
           优先走 F2b 克制储蓄应对；敌无情报/主 inf（未被针对）时照旧攒 T2 */
        const mode = enemyMode(mem, 3);
        if (!mode || mode === 'inf') saving = 2;
      } else if (s.tier === 2 && state.tick >= 900 && !s.research && s.cp >= RESEARCH[3].cost) {
        /* F2 补（GAMES-45）：T3 改机会式升阶——原硬储蓄 300CP 在基础收入下 ≈1250 tick 零出兵，
           对会玩对手等于后半局弃权（QA 实证 t1900 起双塔尽失被 score 反杀 400-300）。
           T2 储蓄保留（前期经济封闭、QA 实测 @1028 达成）；T3 只在 CP 恰好攒够时升，其余照常出兵。 */
        return { cmd: { k: 'research', tier: 3 } };
      }
    }

    /* ---- 出兵 ---- */
    if (saving) return NOOP;                       // 研发储蓄期不出兵（研究期间出兵照常是 sim 规则，此处是策略）
    let spawnCode = null, spawnLane = 0;
    if (lvl === 'casual') {
      /* C1 慢热占塔开局（GAMES-46）：首兵 inf 走最近塔道（此后恢复随机懒散——
         "偶尔想赢一下"的休闲人格：起手有个章法，然后随缘） */
      if (mem.opener === 1 && mem.openerInf === 0 && s.cp >= 20000 && popOfSeat(state, seat) < POP_MAX) {
        mem.openerInf = 1;
        return { cmd: { k: 'spawn', unit: 'inf', lane: state.towers[my === 'A' ? 1 : 0].lane } };
      }
      /* 温和回击（GAMES-46 人格）：基地 5s 内被打 → 60% 概率回敬 1 个 inf 到威胁车道
         （点到为止，不升级响应——"被打后温和回击"） */
      if (mem.provokedAt >= 0 && state.tick - mem.provokedAt <= 50 && s.cp >= 20000 && popOfSeat(state, seat) < POP_MAX && rng() < 0.6) {
        mem.provokedAt = -1;
        return { cmd: { k: 'spawn', unit: 'inf', lane: threatLaneNear(state, my, myBase) } };
      }
      // 解锁池内 rng 均匀；攒到 2× 造价才出。
      // F1 修复（GAMES-45）：闸门夹取 CP 上限内——heavy 2×110=220 > 上限 200 时原闸门永不可达，
      // wanted 只在成功出兵后重掷 → 掷中即整局零出兵、CP 顶死（QA bots-casual g3 seat2 实证）。
      // 夹到 CP_MAX−1000 后任意兵种闸门必可达，"攒 2×"的慢节奏意图不变。
      if (!mem.wanted) mem.wanted = UNIT_CODES[(rng() * 6) | 0];
      const cost = UNITS[mem.wanted].costs[s.tier - 1] * 1000;
      const gate = Math.min(cost * 2, CP_MAX - 1000);
      if (s.cp >= gate && popOfSeat(state, seat) < POP_MAX) { spawnCode = mem.wanted; mem.wanted = null; }
      spawnLane = (rng() * 3) | 0;
    } else if (lvl === 'balanced') {
      // 固定轮换（B0 inf→razor→arty ｜ B1 razor→arty→inf=相位差一起手）；开局 2×inf 试探（tick 30/50）
      if (state.tick <= 60) spawnCode = 'inf';
      else spawnCode = [['inf', 'razor', 'arty'], ['razor', 'arty', 'inf']][mem.opener][mem.rot % 3];
      if (!affordable(state, seat, spawnCode) || popOfSeat(state, seat) >= POP_MAX) return NOOP;
      mem.rot++;
      spawnLane = mem.laneFlip === 0 ? (mem.opener === 1 ? 2 : 0) : (mem.opener === 1 ? 0 : 2);  // 两车道轮换（B1 右道起=镜像指纹）
      mem.laneFlip = 1 - mem.laneFlip;
    } else { // competitive
      // 快攻开局（GAMES-46 开局树：P0 快攻抢塔=先集结最近塔车道 → 3×inf（首兵驻塔、余二压中路）+ drop 抢点；
      // P1 中路压制=无开局 rally，3×inf 直推中路，drop 前期只断兵线不抢塔）
      if (mem.openerInf < 3) {
        const tw = state.towers[my === 'A' ? 1 : 0];  // A 最近 Bravo(lane2 row13) / B 最近 Alpha(lane0 row6)
        if (mem.opener === 1) mem.openerRallied = true;  // P1：跳过开局塔 rally
        else if (!mem.openerRallied) {
          mem.openerRallied = true; mem.lastRallyRow[tw.lane] = tw.row;
          return { cmd: { k: 'rally', lane: tw.lane, row: tw.row } };
        }
        spawnCode = 'inf';
        spawnLane = mem.opener === 1 ? 1 : (mem.openerInf === 0 ? tw.lane : 1);
        if (!affordable(state, seat, spawnCode) || popOfSeat(state, seat) >= POP_MAX) return NOOP;
        mem.openerInf++;
      } else {
        const mode = enemyMode(mem, 3);
        spawnCode = mode ? COUNTER_PICK[mode] : TIER_PICK[s.tier - 1];
        /* 保命压顶（GAMES-45）：敌方单位逼近己方基地（5 行内）→ 出兵车道让位协防
           （razor 铺场探针实证：保塔弃中路被穿透拆家）。只改车道不停克制储蓄——
           克制兵恰是守家主力（arty 120px 射程覆盖基地前沿），攒够即送防区 */
        let threatLane = -1;
        for (let i = 0; i < state.units.length; i++) {
          const u = state.units[i];
          if (u.hp <= 0 || u.drop > 0 || u.team !== foe) continue;
          if (Math.abs(u.y - myBase.y) <= 5 * ROW_M) { threatLane = u.lane; break; }
        }
        /* F2a 争塔（GAMES-45）：未持有的信号塔且点上己方不足 2 → 出兵优先送塔。
           原版只有"己方持有后被夺"的 10s 反攻窗（下方集结段），从未持有则永久弃塔 →
           让出双信号塔被积分通道推平（QA competitive-probe 实证）。塔=CP 收入+积分双通道。
           阈值取 <2 而非 <1：添油式单 inf 会被"驻军 1 + 补位"的对手逐个吃掉（macro-push
           实测后半局 14 连 inf 白给），攒够局部 2v1 才动手；inf 占点 ×2、克制兵清守军，编队互补。 */
        let contestLane = -1;
        for (let ti = 0; ti < state.towers.length && contestLane < 0; ti++) {
          const tw = state.towers[ti];
          if (tw.owner === my) continue;
          let near = 0;
          for (let i = 0; i < state.units.length; i++) { const u = state.units[i]; if (u.seat === seat && u.hp > 0 && laneDist2(tw.lane, tw.y, u.lane, u.y) <= CAP_R2) near++; }
          if (near < 2) contestLane = tw.lane;
        }
        if (!affordable(state, seat, spawnCode)) {
          /* F2b 克制储蓄（GAMES-45）：目标兵买不起 → 停手攒钱，不再"有 CP 即花"直接降 inf
             （原互锁：2CP/s 收入下 45/70CP 克制兵永攒不齐，5 局 0 次非 inf 出兵，
             克制表名存实亡——QA bots-competitive 实证）。储蓄期零出兵零花费（cp 只进不出，
             集结段照常执行）；被动期由 SAVE_WIN=300 tick 封顶，超窗/攒钱目标不可达
             （T3 heavy 210 > CP 上限 200）/己方全灭/敌迫家门（保命压顶）→ 降级 inf 保底
             （支付档降级：inf 先出、攒够换克制）。期间一旦出兵（spawned 计数变动，
             含争塔 inf）→ 窗口重开续攒；情报目标切换（mode 变）→ 窗口随 saveFor 重置。
             储蓄与争塔不互斥：攒够的克制兵直送争塔车道。 */
          const reachable = UNITS[spawnCode].costs[s.tier - 1] * 1000 <= CP_MAX - 1000;
          const saveOk = spawnCode !== 'inf' && reachable && popOfSeat(state, seat) > 0;
          if (saveOk && (mem.saveFor !== spawnCode || mem.saveSpawned !== s.spawned)) {
            mem.saveFor = spawnCode; mem.saveSince = state.tick; mem.saveSpawned = s.spawned;
          }
          if (saveOk && state.tick - mem.saveSince <= SAVE_WIN) spawnCode = null;   // 储蓄中：不出兵（落到下方集结段）
          else spawnCode = 'inf';                                                   // 超窗/不可达/全灭 → 支付档降级
        }
        /* 守塔换位（GAMES-46 人格）：己方持有塔 2.5 行内出现敌军 → 协防该道
           （保命压顶仍最优先，其次守塔，再次争塔/最弱点） */
        const guardTi = guardedTower(state, my, foe);
        spawnLane = threatLane >= 0 ? threatLane
          : guardTi >= 0 ? state.towers[guardTi].lane
          : contestLane >= 0 ? contestLane : weakestLane(state, foe);
        if (!spawnCode || !affordable(state, seat, spawnCode) || popOfSeat(state, seat) >= POP_MAX) spawnCode = null;
      }
    }
    if (spawnCode) return { cmd: { k: 'spawn', unit: spawnCode, lane: spawnLane } };

    /* ---- 陪玩接管期前压（GAMES-46）：真人挂机 → casual bot 把集结线顶到中线带节奏
       （每车道一次；真人回线让位后由让位段钉回守势线） */
    if (lvl === 'casual' && carry === 2) {
      const pushRow = my === 'A' ? 11 : 8;
      for (let l = 0; l < 3; l++) {
        if (!mem.pushRally[l]) { mem.pushRally[l] = true; mem.lastRallyRow[l] = pushRow; return { cmd: { k: 'rally', lane: l, row: pushRow } }; }
      }
      return NOOP;
    }

    /* ---- 集结/信号塔 ---- */
    if (lvl === 'balanced') {
      /* B1 双线占塔开局（GAMES-46）：开局 200 tick 内先把双塔道集结钉到塔位（占塔提速） */
      if (mem.opener === 1 && state.tick < 200) {
        for (let ti = 0; ti < state.towers.length; ti++) {
          const tw = state.towers[ti];
          if (!mem.rallySet[tw.lane] && s.rally[tw.lane] !== tw.row) {
            mem.rallySet[tw.lane] = true; mem.lastRallyRow[tw.lane] = tw.row;
            return { cmd: { k: 'rally', lane: tw.lane, row: tw.row } };
          }
        }
      }
      // 路过顺占：≥2 单位经过未持信号塔 → 该车道集结到塔位
      for (let ti = 0; ti < state.towers.length; ti++) {
        const tw = state.towers[ti];
        if (tw.owner === my) continue;
        let near = 0;
        for (let i = 0; i < state.units.length; i++) { const u = state.units[i]; if (u.seat === seat && u.hp > 0 && laneDist2(tw.lane, tw.y, u.lane, u.y) <= CAP_R2) near++; }
        if (near >= 2 && !mem.rallySet[tw.lane]) {
          mem.rallySet[tw.lane] = true; mem.lastRallyRow[tw.lane] = tw.row;
          return { cmd: { k: 'rally', lane: tw.lane, row: tw.row } };
        }
      }
      // 前线 1/2 深度集结（每车道一次）
      const frontRow = my === 'A' ? 9 : 10;
      for (let l = 0; l < 3; l++) {
        if (!mem.rallySet[l]) { mem.rallySet[l] = true; mem.lastRallyRow[l] = frontRow; return { cmd: { k: 'rally', lane: l, row: frontRow } }; }
      }
    } else if (lvl === 'competitive') {
      // 专职占塔：首个决策派 1×inf 走最近塔（出兵段已优先）；点被夺 10s 内反攻
      for (let ti = 0; ti < state.towers.length; ti++) {
        const tw = state.towers[ti];
        if (mem.towerHad[ti] === my && tw.owner !== my) { mem.retowerUntil = state.tick + 100; mem.retowerIdx = ti; }
        mem.towerHad[ti] = tw.owner;
      }
      let rallyLane = -1, rallyRow = -1;
      const guardTi = guardedTower(state, my, foe);
      if (guardTi >= 0) {
        /* 守塔换位（GAMES-46 人格）：持有塔被压 → 集结线收到塔位协防（换位防守优先于扩张） */
        rallyLane = state.towers[guardTi].lane; rallyRow = state.towers[guardTi].row;
      } else if (mem.retowerIdx >= 0 && state.tick <= mem.retowerUntil && state.towers[mem.retowerIdx].owner !== my) {
        rallyLane = state.towers[mem.retowerIdx].lane; rallyRow = state.towers[mem.retowerIdx].row;
      } else {
        /* F2c 持续争塔（GAMES-45）：还有未持有的信号塔（含从未持有——原版反攻窗只覆盖
           "己方持有后被夺"）→ 该塔车道集结到塔位，单位驻点争塔（与出兵段 F2a 的争塔 inf、
           技能段 drop 抢点三路配合）；双塔在手才转动态前线推进 */
        let contesting = false;
        for (let ti = 0; ti < state.towers.length && !contesting; ti++) {
          const tw = state.towers[ti];
          if (tw.owner !== my) { rallyLane = tw.lane; rallyRow = tw.row; contesting = true; }
        }
        if (!contesting) {
          // 动态：随战团位置（各车道己方最前单位行）
          for (let l = 0; l < 3; l++) {
            let front = -1;
            for (let i = 0; i < state.units.length; i++) { const u = state.units[i]; if (u.seat === seat && u.hp > 0 && u.lane === l) { const r = rowOf(u.y); if (front < 0 || (my === 'A' ? r < front : r > front)) front = r; } }
            const target = front >= 0 ? front : enemyBaseRow(my);
            if (Math.abs(target - mem.lastRallyRow[l]) >= 2) { rallyLane = l; rallyRow = target; break; }
          }
        }
      }
      if (rallyLane >= 0 && (rallyRow !== s.rally[rallyLane])) {
        mem.lastRallyRow[rallyLane] = rallyRow;
        return { cmd: { k: 'rally', lane: rallyLane, row: rallyRow } };
      }
    }

    return NOOP;
  }

  const LEVELS = ['casual', 'balanced', 'competitive'];

  return { META, UNITS, SKILLS, RESEARCH, LEVELS, create, step, execCmd, serialize, deserialize, brain, fnv1a32, mulberry32,
           setBotTuning, botTuning: () => ({ mercy: { ...BOT_TUNING.mercy }, carry: { ...BOT_TUNING.carry } }),
           consts: { POP_MAX, CP_MAX, E_MAX, SCORE_WIN, BASE_HP, DTOWER_HP, ROW_M, LANE_M, FIELD_H_M, BASE_Y, CAP_MAX } };
});

<script>
/* =====================================================================
 * GAMES 联机客户端 SDK（games/_shared/net.js · GAMES-40）——联机游戏页唯一网络出口。
 * 职责（docs/net-protocol.md §7）：连接/入房（含快速匹配）/输入上报/S1 帧与快照接收/
 * 时钟同步（ping/pong 偏移）/ping 显示/自动重连（10s 重连窗内凭 token 复席）。
 *
 * 形态：classic script（构建期内联进游戏页，server 对 /games/_* 一律 404，无外链可能），
 *       暴露全局 GNet。零依赖、单文件；协议 JSON 文本帧。
 * ===================================================================== */
(function (root) {
  'use strict';

  var GW_PORT = 4400; // 网关默认端口（协议 §1）

  /** 网关 origin：<scheme>://<hostname>:4400；?gw=<origin> 可覆盖（LAN/调试） */
  function gwOrigin() {
    var o = null;
    try { o = new URL(root.location.href).searchParams.get('gw'); } catch (e) { /* 非浏览器环境 */ }
    if (o) return o.replace(/\/+$/, '');
    if (!root.location) return 'ws://127.0.0.1:' + GW_PORT;
    var scheme = root.location.protocol === 'https:' ? 'wss' : 'ws';
    return scheme + '://' + root.location.hostname + ':' + GW_PORT;
  }

  /** 会话 sessionStorage 的重连凭证（刷新/崩溃后 ?room= 直达自动复席） */
  function saveResume(roomId, seat, token) {
    try { root.sessionStorage.setItem('gnet:resume:' + roomId, JSON.stringify({ seat: seat, token: token })); } catch (e) { /* 隐私模式 */ }
  }
  function getResume(roomId) {
    try {
      var raw = root.sessionStorage.getItem('gnet:resume:' + roomId);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function clearResume(roomId) {
    try { root.sessionStorage.removeItem('gnet:resume:' + roomId); } catch (e) { /* 忽略 */ }
  }

  var median = function (arr) {
    var a = arr.slice().sort(function (x, y) { return x - y; });
    var m = a.length >> 1;
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  };

  /**
   * connect(opts) → session
   *   opts: { url?, roomId?|quick:true, gameId, mode?, level?, maxTicks?, resume?,
   *           onWelcome, onStarted, onFrame, onState, onSeat, onEnd, onClosed,
   *           onError, onStatus(status) }
   *   status: connecting → open → live → reconnecting → lost / closed
   */
  function connect(opts) {
    var url = (opts.url || gwOrigin()).replace(/^http/, 'ws') + '/ws';
    var session = {
      rttMs: 0, offsetMs: 0, status: 'connecting',
      seat: -1, role: null, token: null, roomId: null, frame: 0, tickMs: 100,
      sendInput: function (keys) { sendInput(keys); },
      sync: function () { send({ t: 'sync' }); }, // 缺帧时请求全量重同步（协议 §4.1）
      close: function () { userClose = true; try { ws.close(); } catch (e) { /* 已断 */ } },
    };

    var ws = null;
    var userClose = false;
    var roomGone = false;          // 房间已回收（曾入房后 join 得 room-gone）：重试已无意义，终结会话
    var lastFrame = 0;             // 最近收到的帧号（输入自动标 lastFrame+1）
    var rtts = [], offsets = [];
    var pingTimer = 0, backoffIdx = 0, retryTimer = 0;
    var lostAt = 0;                // 断线时刻（10s 重连窗）
    var BACKOFF = [500, 1000, 2000, 4000];

    function setStatus(s) {
      session.status = s;
      if (opts.onStatus) opts.onStatus(s);
    }
    function emit(name, arg) {
      var fn = opts[name];
      if (fn) fn(arg);
    }
    function send(obj) {
      if (ws && ws.readyState === 1) { try { ws.send(JSON.stringify(obj)); return true; } catch (e) { return false; } }
      return false;
    }

    function open() {
      setStatus(session.status === 'reconnecting' ? 'reconnecting' : 'connecting');
      try {
        ws = new root.WebSocket(url);
      } catch (e) {
        emit('onError', { code: 'no-ws', message: String(e) });
        setStatus('lost');
        return;
      }
      ws.onopen = function () {
        backoffIdx = 0;
        setStatus('open');
        var resume = opts.resume || (opts.roomId ? getResume(opts.roomId) : null);
        if (opts.quick) send({ t: 'quick', gameId: opts.gameId, level: opts.level, maxTicks: opts.maxTicks });
        else send({ t: 'join', roomId: opts.roomId, mode: opts.mode || 'play', resume: resume || undefined, name: opts.name });
        pingTimer = root.setInterval(function () { send({ t: 'ping', c: root.Date.now() }); }, 2000);
      };
      ws.onmessage = function (ev) {
        var msg = null;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        if (!msg || typeof msg.t !== 'string') return;
        switch (msg.t) {
          case 'welcome':
            session.roomId = msg.roomId;
            session.role = msg.role;
            session.seat = msg.role === 'player' ? msg.seat : -1;
            session.token = msg.token || null;
            session.frame = msg.frame;
            session.tickMs = msg.tickMs || 100;
            lastFrame = msg.frame;
            if (msg.role === 'player') saveResume(msg.roomId, msg.seat, msg.token);
            setStatus('live');
            emit('onWelcome', msg);
            break;
          case 'started':
            emit('onStarted', msg);
            break;
          case 'frame':
            lastFrame = msg.frame;
            session.frame = msg.frame;
            emit('onFrame', msg);
            break;
          case 'state':
            session.frame = msg.frame;
            lastFrame = msg.frame;
            emit('onState', msg);
            break;
          case 'seat':
            emit('onSeat', msg);
            break;
          case 'end':
            if (session.roomId) clearResume(session.roomId);
            emit('onEnd', msg);
            break;
          case 'closed':
            if (session.roomId) clearResume(session.roomId);
            emit('onClosed', msg);
            break;
          case 'pong':
            var now = root.Date.now();
            var rtt = now - msg.c;
            if (rtt >= 0 && rtt < 10000) {
              rtts.push(rtt); if (rtts.length > 5) rtts.shift();
              session.rttMs = Math.round(median(rtts));
              var off = msg.s + rtt / 2 - now;
              offsets.push(off); if (offsets.length > 5) offsets.shift();
              session.offsetMs = Math.round(median(offsets));
            }
            emit('onPong', { rttMs: session.rttMs, offsetMs: session.offsetMs });
            break;
          case 'error':
            // BACKOFF→lost 路径同步（GAMES-51 F3）：曾入房后房已回收——清重连凭证并终结
            // 重试（否则 BACKOFF 空转 10s 后误报 reconnect-timeout，盖掉"对局已结束"语义）
            if (msg.code === 'room-gone' && session.roomId) {
              roomGone = true;
              clearResume(session.roomId);
              try { ws.close(); } catch (e) { /* 已断 */ }
            }
            emit('onError', msg);
            break;
        }
      };
      ws.onclose = function () {
        root.clearInterval(pingTimer);
        if (userClose || roomGone) { setStatus('closed'); return; }
        if (session.status === 'lost') return;
        if (!lostAt) lostAt = root.Date.now();
        if (root.Date.now() - lostAt > 10000) { // 10s 重连窗（协议 §2）
          setStatus('lost');
          emit('onError', { code: 'reconnect-timeout', message: '10s 未能重连' });
          return;
        }
        setStatus('reconnecting');
        retryTimer = root.setTimeout(open, BACKOFF[Math.min(backoffIdx++, BACKOFF.length - 1)]);
      };
      ws.onerror = function () { /* onclose 跟进，重连逻辑在那边 */ };
    }

    function sendInput(keys) {
      if (session.role !== 'player') return false;
      return send({ t: 'input', frame: lastFrame + 1, keys: keys });
    }

    open();
    return session;
  }

  root.GNet = {
    gwOrigin: gwOrigin,
    connect: connect,
    getResume: getResume,
    clearResume: clearResume,
    GW_PORT: GW_PORT,
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

  /* 键盘（QA/调试）：1-6 出兵到选中车道，Q/W/E/R 技能，U 研究，←→ 选车道 */
  window.addEventListener('keydown', function (e) {

  function fxSkillBtn(id) { fx.push({ k: 'skillbtn', id: id, ttl: 180, max: 180 }); }

  /* ---------- 按压动效（GAMES-47，≤80ms 呈现）：60ms 压到 0.92×，130ms 内弹回 ---------- */

  /* ---------- 粒子对象池（GAMES-47 性能守护：固定容量环形分配，渲染层零 GC 压力） ---------- */
  var P_N = 96;
  var parts = [];
  for (var pi = 0; pi < P_N; pi++) parts.push({ on: 0, x: 0, y: 0, vx: 0, vy: 0, ttl: 0, max: 0, col: '', sz: 2 });
  var pCursor = 0;
  function burst(x, y, team, n) {                        // 单位碎裂粒子（阵营色，抛物散落）

    for (var i = 0; i < P_N; i++) {

      p.x += p.vx; p.y += p.vy; p.vy += .04;            // 碎片重力散落（纯渲染层）
      var q = p.ttl / p.max;

  /* ---------- barrage 落点预警圈（GAMES-47：渲染层预测，不改协议）----------

   * 持续 1000ms（≥10 tick）覆盖 0/+2/+4 三轮落弹并逐轮爆闪——sim 落弹与 cast 同 tick 起
   * （BARR_STAGGER=2，判定路径冻结），预警提前量以本地输入时点计，另叠加镜像 state.shells
   * 的在途收缩环（见 drawShellWarn）双通道呈现。 */
  function spawnWarn(lane, row, own) {
    for (var i = 0; i < fx.length; i++) {
      var f = fx[i];
      if (f.k === 'warn' && f.lane === lane && f.row === row && f.max - f.ttl < 500) return;
    }
    fx.push({ k: 'warn', lane: lane, row: row, own: !!own, ttl: 1000, max: 1000, boomN: 0 });
    audio('battle:warn');
  }

  /* ---------- 事件 → 特效（零 diff 触发，协议 §5） ---------- */
  /* die 事件不带坐标（协议形状冻结）——step 前快照单位坐标，step 后按阵亡序对位 */
  var posById = {};
  function snapshotPos() { posById = {}; for (var i = 0; i < simState.units.length; i++) { var u = simState.units[i]; posById[u.id] = { x: unitX(u), y: TOP_H + u.y / 1000 }; } }
  function deadPositions() {
    var alive = {};
    for (var i = 0; i < simState.units.length; i++) alive[simState.units[i].id] = 1;
    var out = Object.keys(posById).map(Number).filter(function (id) { return !alive[id]; }).sort(function (a, b) { return a - b; });
    return out.map(function (id) { return posById[id]; });
  }

  function applyEvents(events, deadPos) {

      } else if (e.k === 'die') {
        var p = deadPos && deadPos[di++] || { x: W / 2, y: H / 2 };
        fx.push({ k: 'boom', x: p.x, y: p.y, team: e.seat % 2 === 0 ? 'A' : 'B', ttl: 300, max: 300 });

  /* ---------- 渲染 ---------- */
  var fpsN = 0, fpsAt = 0, fpsV = 0;

  /* 进场倒计时（3s，3→2→1 每拍砸落缩放）：离线/调试档专用——期间模拟不推进
   * （offlineTimer 门控），sim.step 调用序与 bot rng 流零改变；在线档不延迟帧。 */
  function drawIntro(now) {

  /* 在途 shell 预测环：镜像 state.shells 直读（零协议改动），landAt 倒数收缩环 */
  function drawShellWarn() {

    var mm = Math.max(0, ((simState.maxTicks - simState.tick) / 10) | 0);

    ctx.fillStyle = pop >= 12 ? '#f87171' : '#e8ecf3';
    ctx.fillText('兵力 ' + pop + '/12', W - 95, 37);
    ctx.fillStyle = '#8b93a7'; ctx.fillText(tstr, W - 32, 37);

    ctx.font = '9px ' + FONT; ctx.fillStyle = '#5b657d'; ctx.textAlign = 'left';
    ctx.fillText(ping + ' · ' + S.META.mode, 8, 52);
  }

  /* 战场层：基地（含裂纹三档）/防御塔/信号塔（环形占领进度） */
  function drawBases() {
    for (var i = 0; i < simState.bld.length; i++) {
      var b = simState.bld[i];
      var y = TOP_H + b.y / 1000;
      if (b.kind === 'base') {
        var h = 22;
        ctx.fillStyle = 'rgba(255,255,255,.05)';
        ctx.fillRect(0, b.team === 'B' ? TOP_H : BOT_Y - h, W, h);
        ctx.fillStyle = b.team === 'A' ? '#E8A33D' : '#3DC8E8';   // 阵营色内缘光带
        ctx.globalAlpha = .3;
        if (b.team === 'B') ctx.fillRect(0, TOP_H, W, 4); else ctx.fillRect(0, BOT_Y - 4, W, 4);
        ctx.globalAlpha = 1;
        /* 裂纹三档（75/50/25%） */
        var pct = b.hp / b.max;
        ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1;
        var n = pct <= .25 ? 5 : pct <= .5 ? 3 : pct <= .75 ? 1 : 0;
        for (var c = 0; c < n; c++) {
          var x0 = 40 + c * 70;
          ctx.beginPath();
          if (b.team === 'B') { ctx.moveTo(x0, TOP_H); ctx.lineTo(x0 + 8, TOP_H + 10); ctx.lineTo(x0 + 2, TOP_H + 20); }
          else { ctx.moveTo(x0, BOT_Y); ctx.lineTo(x0 + 8, BOT_Y - 10); ctx.lineTo(x0 + 2, BOT_Y - 20); }
          ctx.stroke();
        }
        /* 基地血条（战场内缘；受击 240ms 内抖动 ±1.5px） */
        var by = b.team === 'B' ? TOP_H + 24 : BOT_Y - 30;
        var jt = baseJitter[b.team] > performance.now() ? (Math.random() - .5) * 3 : 0;
        ctx.fillStyle = 'rgba(255,255,255,.15)';
        ctx.fillRect(67 + jt, by + Math.abs(jt) * .6, 240, 4);
        ctx.fillStyle = TEAM_COLOR[b.team]; ctx.fillRect(67 + jt, by + Math.abs(jt) * .6, 240 * Math.max(0, b.hp) / b.max, 4);
        /* 受击脉冲（表现层差分）→ 边缘红晕 + 血条抖动 + 振动（GAMES-47） */
        if (lastBaseHp[b.team] > b.hp) {
          fx.push({ k: 'basehit', team: b.team, ttl: 260, max: 260 });
          baseJitter[b.team] = performance.now() + 240;
          audio('battle:basehit');
          if (b.team === myTeam) {
            shakeT = Math.max(shakeT, 160); shakeAmp = 3;
            fx.push({ k: 'vig', ttl: 420, max: 420 });   // 我方受击：屏幕边缘红晕（受击方视角）
            haptic(22);
          }
        }
        lastBaseHp[b.team] = b.hp;
      } else {                                          // dtower：中车道方块塔 + 血条
        ctx.fillStyle = '#2a3247'; ctx.strokeStyle = TEAM_COLOR[b.team]; ctx.lineWidth = 1.5;
        var tx = 62.5 + 125 - 14, ty = y - 14;
        ctx.fillRect(tx, ty, 28, 28); ctx.strokeRect(tx, ty, 28, 28);
        ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(tx - 4, ty - 8, 36, 4);
        ctx.fillStyle = TEAM_COLOR[b.team]; ctx.fillRect(tx - 4, ty - 8, 36 * Math.max(0, b.hp) / b.max, 4);
      }
    }
  }

  function drawTowers() {
    for (var i = 0; i < simState.towers.length; i++) {
      var tw = simState.towers[i];
      var x = 62.5 + tw.lane * 125, y = TOP_H + tw.y / 1000;
      ctx.fillStyle = '#39466a'; ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x - 7, y + 8); ctx.lineTo(x - 5, y - 12); ctx.lineTo(x + 5, y - 12); ctx.lineTo(x + 7, y + 8); ctx.closePath(); ctx.fill(); ctx.stroke();
      var col = tw.owner ? TEAM_COLOR[tw.owner] : '#8b93a7';
      if (tw.cap > 0 && tw.cap < 100) col = tw.capTeam ? TEAM_COLOR[tw.capTeam] : col;
      ctx.strokeStyle = col; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, 15, -Math.PI / 2, -Math.PI / 2 + (tw.cap / 100) * Math.PI * 2); ctx.stroke();
      if (tw.owner) {                                    // 持有方旗帜（持续小幅波动，纯渲染层）
        var wt = performance.now() / 300 + tw.i * 2;
        ctx.strokeStyle = 'rgba(232,236,243,.8)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y - 12); ctx.lineTo(x, y - 22); ctx.stroke();
        ctx.fillStyle = TEAM_COLOR[tw.owner];
        ctx.beginPath();
        ctx.moveTo(x, y - 22);
        ctx.lineTo(x + 8, y - 22 + 2.5 + Math.sin(wt) * 1.2);

        ctx.closePath(); ctx.fill();

  function drawRallies() {                              // 集结旗（己方各车道，§1.4）
    if (mySeat < 0 || !simState.seats[mySeat]) return;
    var rally = simState.seats[mySeat].rally;

      ctx.fillStyle = TEAM_COLOR[myTeam || 'A'];

  /* 单位：俯视 2.5D 剪影（底盘阴影 + 阵营色本体 12-18px）+ 微血条 */
  function drawUnits(alpha) {
    var units = simState.units;
    for (var i = 0; i < units.length; i++) {
      var u = units[i];
      var py = u.y;
      if (prevY && prevY[u.id] !== undefined && alpha < 1) py = prevY[u.id] + (u.y - prevY[u.id]) * alpha;
      var x = unitX(u), y = TOP_H + py / 1000;
      var col = TEAM_COLOR[u.team];
      var sz = u.code === 'heavy' ? 16 : u.code === 'razor' ? 13 : u.code === 'arty' ? 12 : u.code === 'sniper' ? 9 : u.code === 'medic' ? 11 : 10;
      if (u.drop > 0) {                                  // 空降舱下落（15 tick 无敌）
        ctx.fillStyle = TEAM_DIM[u.team] + '.5)';
        ctx.beginPath(); ctx.arc(x, y - u.drop * 2.2, sz * .6, 0, 7); ctx.fill();
        continue;
      }
      ctx.fillStyle = 'rgba(0,0,0,.35)';                 // 底盘阴影
      ctx.beginPath(); ctx.ellipse(x, y + 3, sz * .6, sz * .28, 0, 0, 7); ctx.fill();
      ctx.fillStyle = col;
      if (u.code === 'medic') {                          // 军医：圆 + 十字
        ctx.beginPath(); ctx.arc(x, y, sz * .55, 0, 7); ctx.fill();
        ctx.fillStyle = '#0D1117'; ctx.fillRect(x - 4, y - 1.2, 8, 2.4); ctx.fillRect(x - 1.2, y - 4, 2.4, 8);
      } else if (u.code === 'razor' || u.code === 'heavy') {
        ctx.fillRect(x - sz / 2, y - sz / 3, sz, sz * .66);
        ctx.fillStyle = 'rgba(0,0,0,.3)';
        ctx.fillRect(x - sz / 2, y - sz / 6, sz, sz * .3);
        if (u.code === 'heavy') { ctx.fillStyle = col; ctx.fillRect(x - 2, y - sz / 2 - 2, 4, 5); }
      } else if (u.code === 'arty' || u.code === 'sniper') {
        ctx.beginPath(); ctx.arc(x, y, sz * .5, 0, 7); ctx.fill();
        ctx.strokeStyle = col; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - (u.team === 'A' ? 9 : -9)); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(x, y, sz * .5, 0, 7); ctx.fill();
      }
      if (u.seat === mySeat) { ctx.strokeStyle = 'rgba(232,236,243,.6)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x, y, sz * .75 + 2, 0, 7); ctx.stroke(); }
      if (u.hp < u.maxHp) {                              // 微血条
        ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(x - 7, y - sz * .75 - 5, 14, 2);
        ctx.fillStyle = col; ctx.fillRect(x - 7, y - sz * .75 - 5, 14 * Math.max(0, u.hp) / u.maxHp, 2);
      }
      if (u.tier > 1) { ctx.fillStyle = '#fde68a'; ctx.font = '8px ' + FONT; ctx.textAlign = 'center'; ctx.fillText('T' + u.tier, x + 9, y - 6); }
    }
  }

  function drawFx(now) {
    for (var i = fx.length - 1; i >= 0; i--) {
      var f = fx[i];
      f.ttl -= 16;
      if (f.ttl <= 0) { fx.splice(i, 1); continue; }
      var p = f.ttl / f.max;
      if (f.k === 'ripple') {
        ctx.strokeStyle = 'rgba(232,236,243,' + (p * .6) + ')'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(f.x, f.y, (1 - p) * 26 + 4, 0, 7); ctx.stroke();
      } else if (f.k === 'door') {
        var dy = f.team === 'A' ? BOT_Y - 26 : TOP_H + 2;
        ctx.fillStyle = TEAM_DIM[f.team] + (p * .8) + ')';
        ctx.fillRect(W / 2 - 30, dy, 60, 24 * (1 - p * .5));
      } else if (f.k === 'boom') {
        var col = f.team === 'A' ? '232,163,61' : '61,200,232';
        for (var j = 0; j < 5; j++) {
          var a2 = j * 1.26 + (1 - p) * 2;
          var d = (1 - p) * 22;
          ctx.fillStyle = 'rgba(' + col + ',' + (p * .8) + ')';
          ctx.fillRect(f.x + Math.cos(a2) * d - 1.5, f.y + Math.sin(a2) * d - 1.5, 3, 3);
        }
      } else if (f.k === 'float') {
        ctx.fillStyle = f.color; ctx.globalAlpha = p; ctx.font = '700 12px ' + FONT; ctx.textAlign = 'center';
        ctx.fillText(f.txt, f.x, f.y - (1 - p) * 18); ctx.globalAlpha = 1;
      } else if (f.k === 'cast') {
        ctx.fillStyle = 'rgba(253,230,138,' + (p * .25) + ')'; ctx.fillRect(0, 0, W, H);
      } else if (f.k === 'rallyring') {                 // 集结半径圈展开（长按落点）
        var rgr = 4 + (1 - p) * 36;
        ctx.strokeStyle = 'rgba(232,236,243,' + (p * .8) + ')'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(f.x, f.y, rgr, 0, 7); ctx.stroke();
        ctx.strokeStyle = 'rgba(253,230,138,' + (p * .5) + ')';
        ctx.beginPath(); ctx.arc(f.x, f.y, rgr * .55, 0, 7); ctx.stroke();
      } else if (f.k === 'warn') {                      // barrage 落点预警圈（≥10 tick 窗 + 三轮落弹爆闪）
        var wx = 62.5 + f.lane * 125, wy = TOP_H + f.row * ROW_PX + 12;
        var wph = f.max - f.ttl;
        ctx.strokeStyle = 'rgba(248,113,113,' + (.45 + .3 * Math.abs(Math.sin(wph / 90))) + ')'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(wx, wy, 45, 0, 7); ctx.stroke();
        ctx.fillStyle = 'rgba(248,113,113,' + (.08 + .05 * Math.abs(Math.sin(wph / 90))) + ')';
        ctx.beginPath(); ctx.arc(wx, wy, 45, 0, 7); ctx.fill();
        while (f.boomN < 3 && wph >= f.boomN * 200) {   // 落弹帧 0/+2/+4（tick 对齐 200ms）
          if (f.boomN === 0) audio('battle:boom');
          f.boomN++;
        }
        for (var wk = 0; wk < 3; wk++) {
          var ip = wph - wk * 200;
          if (ip >= 0 && ip < 160) {
            ctx.strokeStyle = 'rgba(253,230,138,' + (1 - ip / 160) + ')'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(wx, wy, 45 * (.4 + ip / 160 * .6), 0, 7); ctx.stroke();
          }
        }
      } else if (f.k === 'vig') {                       // 我方基地受击：屏幕边缘红晕（径向渐变）
        var vg = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .72);
        vg.addColorStop(0, 'rgba(248,113,113,0)');
        vg.addColorStop(1, 'rgba(248,113,113,' + (p * .5) + ')');
        ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
      } else if (f.k === 'flag') {                      // 占点翻转：旗帜升起 + 旗面波动（520ms）
        var twf = simState.towers[f.tower];
        if (twf) {
          var fxp = 62.5 + twf.lane * 125, fyp = TOP_H + twf.y / 1000 - 12;
          var hoist = Math.min(1, (1 - p) * 1.8);       // 前 ~290ms 升旗
          var ftop = fyp + 10 - 16 * hoist;
          ctx.strokeStyle = 'rgba(232,236,243,.9)'; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(fxp, fyp + 10); ctx.lineTo(fxp, ftop); ctx.stroke();
          ctx.fillStyle = TEAM_COLOR[f.team] || '#8b93a7';
          var wob = Math.sin((f.max - f.ttl) / 60) * 1.5;
          ctx.beginPath();
          ctx.moveTo(fxp, ftop);
          ctx.lineTo(fxp + 10 * hoist, ftop + 3 * hoist + wob);
          ctx.lineTo(fxp, ftop + 6 * hoist);
          ctx.closePath(); ctx.fill();
        }
      } else if (f.k === 'ready') {                     // 技能冷却转好：金色微闪扩散环
        var rq = skillRect(f.id);
        ctx.strokeStyle = 'rgba(253,230,138,' + p + ')'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(rq.x + rq.w / 2, rq.y + rq.h / 2, 14 + (1 - p) * 10, 0, 7); ctx.stroke();
      } else if (f.k === 'aim') {
        ctx.strokeStyle = 'rgba(248,113,113,.9)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(f.x, f.y, 8 + (1 - p) * 10, 0, 7); ctx.stroke();
      } else if (f.k === 'basehit') {
        var g2 = ctx.createLinearGradient(0, f.team === 'B' ? TOP_H : BOT_Y - 80, 0, f.team === 'B' ? TOP_H + 80 : BOT_Y);
        var bc = f.team === myTeam ? '232,163,61' : '61,200,232';
        g2.addColorStop(0, 'rgba(' + bc + ',0)'); g2.addColorStop(1, 'rgba(' + bc + ',' + (p * .5) + ')');
        ctx.fillStyle = g2;
        ctx.fillRect(0, f.team === 'B' ? TOP_H : BOT_Y - 80, W, 80);
      } else if (f.k === 'skillbtn') {
        var r2 = skillRect(f.id);
        ctx.strokeStyle = 'rgba(253,230,138,' + p + ')'; ctx.lineWidth = 2;
        ctx.strokeRect(r2.x - 1, r2.y - 1, r2.w + 2, r2.h + 2);
      }
    }
    /* barrage 落点呈现：'warn' 预警圈（事件/输入驱动）+ drawShellWarn 在途收缩环（镜像 shells） */
  }

  function drawDragCard() {

  function drawSelLane() {

    ctx.strokeRect(selLane * 125 + 2, TOP_H + 2, 121, FIELD_H - 4);
