<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>落块消行 03</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0b0e14; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
/* 本款数值（与同目录 game.json 同源生成——GAMES-19 build-b.mjs；引擎零网络请求，离线可玩） */
const CONFIG = {
  "slug": "block-drop-cascade-03",
  "title": "落块消行 03",
  "type": "block-drop",
  "tier": "simple",
  "levels": 30,
  "specVersion": "1.1.0",
  "version": "1.0.0",
  "orientation": "portrait",
  "entry": "index.html",
  "controls": {
    "primary": "swipe-any",
    "secondary": "tap"
  },
  "avgDurationSec": 300,
  "scoring": {
    "win": "消行 ≥ lines(L)",
    "lose": "堆顶（新块无处生成）",
    "s2": "150×lines(L)",
    "s3": "220×lines(L)"
  },
  "description": "滑动操作的方块下落：左右移、上滑/点按旋转、下滑软降、快滑硬降，消行达标即胜（简单档）",
  "typeExtra": {
    "dropMs": 960,
    "wellW": 10,
    "garbageBase": 3,
    "nextN": 3,
    "linesFactor": 0.9
  }
};
</script>
<script>
'use strict';
/* =====================================================================
 * GAMES 公共框架（spec §4.4/§5）——所有类型引擎共享，由 build.mjs 内联进各 index.html。
 * 职责：PRNG（§5.6 逐字实现）、宿主钩子+telemetry 兜底（§5.3）、localStorage 三键（§5.2）、
 *       WebAudio 程序合成音效、375×667 画布外壳（DPR 缩放/安全区）、关卡流程与星级（§3.2）、
 *       事件词表（boot/start/levelEnd/end）、选关/结算/暂停 UI。
 * 确定性铁律：判定路径零 Math.random；每关 rng = mulberry32(fnv1a32(`${slug}#${level}`))。
 * ===================================================================== */
const G = (function () {

  /* ---------- §5.6 PRNG 参考实现（全引擎统一，冻结） ---------- */
  function fnv1a32(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
  function mulberry32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  /* ---------- 通用工具 ---------- */
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const lerp = (a, b, t) => a + (b - a) * t;
  const TIER_CN = { relaxed: '轻松', simple: '简单', normal: '标准', hard: '困难', master: '大师' };
  /** 滑动定向（§12：位移 ≥24px 定向，主轴优先）。不足阈值返回 null。 */
  function swipeDir(dx, dy) {
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return null;
    return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'r' : 'l') : (dy > 0 ? 'd' : 'u');
  }
  function roundRect(g, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    g.beginPath();
    g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  const FONT = (px, w) => `${w || 400} ${px}px -apple-system,"PingFang SC","Noto Sans SC",sans-serif`;

  /* ---------- §5.3 宿主钩子 + telemetry 兜底 ---------- */
  function makeReporter(slug, store) {
    return function report(event, payload) {
      try { (window.__GAMES_HOOK__ && window.__GAMES_HOOK__.report) ? window.__GAMES_HOOK__.report(event, payload) : store.telemetryPush({ t: Date.now(), event, payload }); }
      catch (e) { /* 宿主钩子异常不影响游戏 */ }
    };
  }

  /* ---------- §5.2 localStorage 三键（节流/flush/损坏静默重置） ---------- */
  function makeStore(slug) {
    const P = `games:${slug}:progress`, S = `games:${slug}:settings`, T = `games:${slug}:telemetry`;
    const LS = (() => { try { return window.localStorage; } catch (e) { return null; } })();
    function readJson(k, dflt) {
      if (!LS) return dflt;
      try { const v = JSON.parse(LS.getItem(k)); return (v && typeof v === 'object') ? v : dflt; } catch (e) { return dflt; } /* 损坏静默重置 */
    }
    const st = {
      progress: null, settings: null,
      _pending: {}, _lastWrite: 0,
      load(levels) {
        st.progress = Object.assign({ unlocked: 1, best: 0, stars: new Array(levels).fill(0), updated: 0 }, readJson(P, {}));
        if (!Array.isArray(st.progress.stars)) st.progress.stars = new Array(levels).fill(0);
        st.settings = Object.assign({ sound: true }, readJson(S, {}));
      },
      telemetryPush(item) {
        if (!LS) return;
        const ring = readJson(T, { items: [] }).items || [];
        ring.push(item); if (ring.length > 50) ring.splice(0, ring.length - 50);
        try { LS.setItem(T, JSON.stringify({ items: ring })); } catch (e) { /* 满/禁则弃 */ }
      },
      mark(kind) { st._pending[kind] = true; st.flushIfDue(); },
      flushIfDue() {
        const now = Date.now();
        if (now - st._lastWrite < 1000) return;              // 写入节流 ≤1 次/秒
        st._lastWrite = now;
        if (!LS) { st._pending = {}; return; }
        try {
          if (st._pending.progress) { st.progress.updated = now; LS.setItem(P, JSON.stringify(st.progress)); }
          if (st._pending.settings) LS.setItem(S, JSON.stringify(st.settings));
        } catch (e) { /* 配额满等静默 */ }
        st._pending = {};
      },
      flushNow() { st._lastWrite = 0; st.flushIfDue(); }
    };
    return st;
  }

  /* ---------- WebAudio 程序合成音效（装饰，可关） ---------- */
  function makeSound(store) {
    let ac = null;
    function ctx() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } } return ac; }
    function tone(f0, f1, dur, type, vol) {
      const a = ctx(); if (!a) return;
      const o = a.createOscillator(), gn = a.createGain(), t = a.currentTime;
      o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn).connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
    }
    return function snd(name) {
      if (!store.settings.sound) return;
      if (name === 'tap') tone(660, 440, 0.08, 'square', 0.04);
      else if (name === 'pop') tone(520, 900, 0.1, 'triangle', 0.08);
      else if (name === 'ok') { tone(523, 523, 0.12, 'sine', 0.08); setTimeout(() => tone(784, 784, 0.16, 'sine', 0.08), 110); }
      else if (name === 'bad') tone(220, 110, 0.3, 'sawtooth', 0.06);
      else if (name === 'star') tone(1046, 1568, 0.18, 'sine', 0.07);
    };
  }

  /* ---------- 画布外壳 + 关卡流程（boot 入口） ----------
   * engineFactory(game) → { startLevel, update(dt), render(g), onDown, onMove, onUp, hudParts? }
   *   game.cfg / game.W / game.H / game.area（顶栏下方的游戏区矩形）
   *   game.rng（每关重置的 PRNG）/ game.level
   *   game.setHud([{t,v}...])（顶栏状态，≤3 组）/ game.toast(text)
   *   game.win(score, {s2,s3} 或 {stars}) / game.lose(score)
   * 框架负责：选关/顶栏/结算浮层/星级与进度/事件上报/音效开关。 */
  function boot(cfg, engineFactory) {
    const W = 375, H = 667, TOP = 48;
    const cvs = document.getElementById('cv'), g = cvs.getContext('2d');
    let scale = 1;
    function fit() {
      const vw = window.innerWidth, vh = window.innerHeight;
      const s = Math.min(vw / W, vh / H), dpr = clamp(window.devicePixelRatio || 1, 1, 3);
      cvs.style.width = (W * s) + 'px'; cvs.style.height = (H * s) + 'px';
      cvs.width = Math.round(W * s * dpr); cvs.height = Math.round(H * s * dpr);
      scale = s * dpr;
    }
    function toXY(e) { const r = cvs.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }

    const store = makeStore(cfg.slug); store.load(cfg.levels);
    const report = makeReporter(cfg.slug, store);
    const snd = makeSound(store);

    /* --- 会话与关卡状态 --- */
    let screen = 'home';            // home | play
    let engine = null, curLevel = 1, hudParts = [], toast = { text: '', t: 0 };
    let result = null;              // {level,win,score,stars,next:boolean,all:boolean}
    let session = null;             // {score, t0} → end 事件
    let homeScroll = 0, gridMode = false, dragFrom = null;
    let animT = 0;

    report('boot', { slug: cfg.slug, version: cfg.version, specVersion: cfg.specVersion });

    /* --- UI 帮助 --- */
    function btn(r, label, cb) { // 命中检测+绘制合一（当前帧绘制时命中测试由 down 处理器完成）
      g.fillStyle = '#3b4a6b'; roundRect(g, r.x, r.y, r.w, r.h, r.h / 2); g.fill();
      g.fillStyle = '#e8ecf3'; g.font = FONT(16, 600); g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(label, r.x + r.w / 2, r.y + r.h / 2 + 1);
      hitButtons.push({ r, cb });
    }
    let hitButtons = [];
    function drawStars(x, y, n, size) {
      for (let i = 0; i < 3; i++) {
        g.fillStyle = i < n ? '#ffd166' : '#3a4358'; g.font = FONT(size, 700); g.textAlign = 'left'; g.textBaseline = 'middle';
        g.fillText('★', x + i * (size + 2), y);
      }
    }
    function fmt(n) { return n >= 10000 ? (n / 1000).toFixed(1) + 'k' : '' + Math.floor(n); }

    /* --- 关卡流程（事件词表 §5.3） --- */
    function startLevel(L) {
      curLevel = L; screen = 'play'; result = null; hudParts = []; levelT0 = performance.now();
      if (!session) session = { score: 0, t0: performance.now() };
      engine = engineFactory({
        W, H, cfg, level: L,
        area: { x: 0, y: TOP, w: W, h: H - TOP },
        rng: mulberry32(fnv1a32(`${cfg.slug}#${L}`)),
        setHud: (p) => { hudParts = p.slice(0, 3); },
        toast: (t) => { toast = { text: t, t: 1.4 }; },
        win: (score, opt) => finish(true, score, opt),
        lose: (score) => finish(false, score, {}),
      });
      engine.startLevel();
      report('start', { level: L });
      snd('tap');
    }
    function finish(win, score, opt) {
      if (result) return;                                     // 双保险：结算后不再重复判局
      let stars = 0;
      if (win) stars = opt.stars != null ? opt.stars : 1 + (score >= opt.s2 ? 1 : 0) + (score >= opt.s3 ? 1 : 0);
      const durMs = Math.round(performance.now() - levelT0);
      session.score += score;
      const all = win && curLevel >= cfg.levels;
      result = { level: curLevel, win, score, stars, all, t: 0 };
      if (win) {                                              // 进度只升不降（§3.2）
        const p = store.progress;
        p.unlocked = Math.max(p.unlocked, Math.min(cfg.levels, curLevel + 1));
        p.best = Math.max(p.best, curLevel);
        p.stars[curLevel - 1] = Math.max(p.stars[curLevel - 1] || 0, stars);
        store.mark('progress');
      }
      report('levelEnd', { level: curLevel, win, score, stars, durMs });
      if (all) { report('end', { reason: 'allClear', totalScore: session.score, durMs: Math.round(performance.now() - session.t0) }); session = null; }
      snd(win ? 'ok' : 'bad');
    }
    let levelT0 = performance.now();

    function goHome() {
      if (screen === 'play' && session) {                     // 退出会话 → quit
        report('end', { reason: 'quit', totalScore: session.score, durMs: Math.round(performance.now() - session.t0) });
        session = null;
      }
      screen = 'home'; result = null; engine = null; store.flushNow();
    }

    /* --- 输入路由 --- */
    cvs.addEventListener('pointerdown', (e) => {
      e.preventDefault(); cvs.setPointerCapture && cvs.setPointerCapture(e.pointerId);
      const p = toXY(e);
      if (screen === 'play' && !result && engine) { engine.onDown(p.x, p.y); }
      dragFrom = { ...p, scroll: homeScroll, moved: false };
    });
    cvs.addEventListener('pointermove', (e) => {
      const p = toXY(e);
      if (screen === 'play' && !result && engine) engine.onMove(p.x, p.y);
      if (dragFrom && screen === 'home' && gridMode) {
        const dy = p.y - dragFrom.y;
        if (Math.abs(dy) > 6) { dragFrom.moved = true; homeScroll = clamp(dragFrom.scroll + dy, 0, 1e5); }
      }
    });
    const upHandler = (e) => {
      const p = toXY(e);
      const wasDrag = dragFrom && dragFrom.moved; dragFrom = null;
      if (wasDrag) return;
      /* 结算浮层按钮 */
      if (result) { for (const b of hitButtons) if (hit(b.r, p)) { b.cb(); return; } return; }
      if (screen === 'home') { for (const b of hitButtons) if (hit(b.r, p)) { b.cb(); return; } return; }
      if (engine) engine.onUp(p.x, p.y);
    };
    cvs.addEventListener('pointerup', upHandler);
    cvs.addEventListener('pointercancel', upHandler);
    function hit(r, p) { return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h; }

    /* --- 崩溃恢复：页面隐藏/关闭前 flush（§5.2） --- */
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') store.flushNow(); });
    window.addEventListener('pagehide', () => store.flushNow());
    window.addEventListener('beforeunload', () => store.flushNow());

    /* --- 主循环 --- */
    let last = performance.now();
    function frame(t) {
      const dt = clamp((t - last) / 1000, 0, 0.05); last = t; animT += dt;
      store.flushIfDue();
      hitButtons = [];
      g.setTransform(scale, 0, 0, scale, 0, 0);
      g.fillStyle = '#101522'; g.fillRect(0, 0, W, H);
      if (screen === 'home') drawHome();
      else drawPlay(dt);
      requestAnimationFrame(frame);
    }

    function drawHome() {
      const p = store.progress;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = '#e8ecf3'; g.font = FONT(30, 800); g.fillText(cfg.title, W / 2, 92);
      g.fillStyle = '#8b94a7'; g.font = FONT(14, 400);
      g.fillText(`${TIER_CN[cfg.tier] || cfg.tier} · ${cfg.levels} 关 · ${cfg.controls.primary}`, W / 2, 124);
      const next = Math.min(p.unlocked, cfg.levels);
      if (!gridMode) {
        btn({ x: 57, y: 210, w: 261, h: 64 }, p.best ? `继续 · 第 ${next} 关` : `开始 · 第 1 关`, () => startLevel(next));
        btn({ x: 57, y: 290, w: 261, h: 52 }, '选关', () => { gridMode = true; homeScroll = 0; });
        g.fillStyle = '#8b94a7'; g.font = FONT(12, 400);
        g.fillText(`最高通关 ${p.best} / ${cfg.levels}`, W / 2, 372);
      } else {
        g.save(); g.beginPath(); g.rect(0, 150, W, H - 210); g.clip();
        g.translate(0, -homeScroll);
        const cols = 5, cw = 58, ch = 46, x0 = (W - cols * cw - (cols - 1) * 8) / 2;
        for (let i = 0; i < cfg.levels; i++) {
          const L = i + 1, r = { x: x0 + (i % cols) * (cw + 8), y: 160 + Math.floor(i / cols) * (ch + 14), w: cw, h: ch };
          const un = L <= p.unlocked;
          g.fillStyle = un ? '#2c3a5c' : '#1a2133'; roundRect(g, r.x, r.y, r.w, r.h, 10); g.fill();
          if (L === p.unlocked) { g.strokeStyle = '#6ea8ff'; g.lineWidth = 2; roundRect(g, r.x, r.y, r.w, r.h, 10); g.stroke(); }
          g.fillStyle = un ? '#e8ecf3' : '#3a4358'; g.font = FONT(15, 600);
          g.fillText('' + L, r.x + r.w / 2, r.y + 16);
          g.font = FONT(11, 400);
          g.fillStyle = ['#3a4358', '#ffd166', '#ffd166', '#ffd166'][(p.stars[i] || 0)];
          g.fillText('★'.repeat(p.stars[i] || 0) || '·', r.x + r.w / 2, r.y + 33);
          if (un) hitButtons.push({ r, cb: () => startLevel(L) });
        }
        const maxY = 160 + Math.ceil(cfg.levels / cols) * (ch + 14);
        homeScroll = clamp(homeScroll, 0, Math.max(0, maxY - (H - 70)));
        g.restore();
        btn({ x: 57, y: H - 58, w: 261, h: 44 }, '返回', () => { gridMode = false; });
      }
      /* 音效开关（右上，状态区） */
      const sr = { x: W - 56, y: 26, w: 40, h: 40 };
      g.fillStyle = '#2c3a5c'; roundRect(g, sr.x, sr.y, sr.w, sr.h, 12); g.fill();
      g.fillStyle = store.settings.sound ? '#ffd166' : '#5b6478'; g.font = FONT(18, 600);
      g.fillText(store.settings.sound ? '♪' : '×', sr.x + 20, sr.y + 21);
      hitButtons.push({ r: sr, cb: () => { store.settings.sound = !store.settings.sound; store.mark('settings'); snd('tap'); } });
      g.fillStyle = '#3a4358'; g.font = FONT(11, 400); g.fillText(`${cfg.slug} v${cfg.version}`, W / 2, H - 16);
    }

    function drawPlay(dt) {
      if (engine) { engine.update(dt); engine.render(g); }
      /* 顶栏（状态区，§5.5） */
      g.fillStyle = '#151b2eee'; g.fillRect(0, 0, W, TOP);
      g.strokeStyle = '#232c42'; g.beginPath(); g.moveTo(0, TOP - .5); g.lineTo(W, TOP - .5); g.stroke();
      const back = { x: 8, y: 8, w: 44, h: 32 };
      g.fillStyle = '#2c3a5c'; roundRect(g, back.x, back.y, back.w, back.h, 8); g.fill();
      g.fillStyle = '#e8ecf3'; g.font = FONT(14, 600); g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText('‹', back.x + 22, back.y + 17);
      hitButtons.push({ r: back, cb: goHome });
      g.textAlign = 'left'; g.font = FONT(12, 500); g.fillStyle = '#8b94a7';
      let x = 64; g.fillText('第' + curLevel + '关', x, TOP / 2); x += 46;
      g.textAlign = 'center'; g.font = FONT(13, 700); g.fillStyle = '#e8ecf3';
      if (hudParts.length === 1) g.fillText(hudParts[0].t + ' ' + fmt(hudParts[0].v), (x + W) / 2, TOP / 2);
      else if (hudParts.length === 2) {
        g.textAlign = 'left';
        g.fillText(hudParts[0].t, x + 6, TOP / 2 - 8); g.font = FONT(14, 700); g.fillStyle = '#9fc0ff'; g.fillText(fmt(hudParts[0].v), x + 6, TOP / 2 + 9);
        g.fillStyle = '#8b94a7'; g.font = FONT(12, 500); g.fillText(hudParts[1].t, W / 2 + 24, TOP / 2 - 8);
        g.font = FONT(14, 700); g.fillStyle = '#9fc0ff'; g.fillText(fmt(hudParts[1].v), W / 2 + 24, TOP / 2 + 9);
      }
      /* toast */
      if (toast.t > 0) {
        toast.t -= dt;
        g.globalAlpha = clamp(toast.t / 0.4, 0, 1) * .92;
        g.fillStyle = '#0b0e14'; g.fillRect(0, TOP + 90, W, 40);
        g.fillStyle = '#ffd166'; g.font = FONT(15, 600); g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(toast.text, W / 2, TOP + 110); g.globalAlpha = 1;
      }
      /* 结算浮层 */
      if (result) {
        result.t += dt;
        g.fillStyle = 'rgba(11,14,20,.82)'; g.fillRect(0, 0, W, H);
        const cy = 208, cw2 = 295, ch2 = 250, cx = (W - cw2) / 2;
        g.fillStyle = '#1a2133'; roundRect(g, cx, cy, cw2, ch2, 18); g.fill();
        g.strokeStyle = '#2c3a5c'; g.lineWidth = 1.5; roundRect(g, cx, cy, cw2, ch2, 18); g.stroke();
        g.textAlign = 'center';
        g.fillStyle = result.win ? '#7bd88f' : '#ff8fa3'; g.font = FONT(21, 800);
        g.fillText(result.all ? '全部通关！' : result.win ? '第 ' + result.level + ' 关 通过' : '第 ' + result.level + ' 关 失败', W / 2, cy + 44);
        drawStars(W / 2 - 36, cy + 84, result.stars, 26);
        g.fillStyle = '#e8ecf3'; g.font = FONT(38, 800); g.fillText(fmt(result.score), W / 2, cy + 130);
        g.fillStyle = '#8b94a7'; g.font = FONT(12, 400); g.fillText('得分', W / 2, cy + 154);
        const bw = 118, bh = 48, gap = 14, bx = (W - bw * 2 - gap) / 2;
        btn({ x: bx, y: cy + 178, w: bw, h: bh }, '重试', () => startLevel(result.level));
        if (result.win && !result.all) btn({ x: bx + bw + gap, y: cy + 178, w: bw, h: bh }, '下一关', () => startLevel(result.level + 1));
        else btn({ x: bx + bw + gap, y: cy + 178, w: bw, h: bh }, '首页', goHome);
      }
    }

    fit(); window.addEventListener('resize', fit);
    requestAnimationFrame(frame);
  }

  return { fnv1a32, mulberry32, clamp, lerp, swipeDir, roundRect, FONT, TIER_CN, boot };
})();

</script>
<script>
'use strict';
/* =====================================================================
 * 方块下落引擎（spec §25）：10×20 井，七种四格块 7-bag 序列（seed 洗牌），
 * 填满整行消除，消行数达标即胜；新块无处生成（堆顶）即败。
 * 曲线：drop(L)=max(120, round(dropMs×(1−0.50p)))；garbage(L)=round(garbageBase×p)；
 *       lines(L)=ceil((10+15p)×linesFactor)。p=(L−1)/(Ln−1)。
 * 生成（§25）：每 7 块一袋洗牌（公平分布）；关底预置垃圾行 1–2 洞位由 seed 决定。
 * 计分：score=消行×100+双消×300+三消×500+四消×800（按次计）；s2=150×lines(L)，s3=220×lines(L)。
 * 交互（§25 竖屏单手映射）：左右滑/横拖=移动（每格），上滑/点按=旋转，下滑=软降一格，
 *   快速下滑（fling，单次事件下移 >44px）=硬降；井居中占屏宽 60%。
 * ===================================================================== */
const BlockDropEngine = (function () {
  const COLS = 10, ROWS = 20, CELL = 22;
  const COLORS = ['', '#9fc0ff', '#ffd166', '#c792ea', '#7bd88f', '#ff8fa3', '#6ed0e0', '#ff9f6e', '#5b6478'];
  const SHAPES = [
    [[1, 1, 1, 1]],           // I
    [[1, 1], [1, 1]],         // O
    [[0, 1, 0], [1, 1, 1]],   // T
    [[1, 0, 0], [1, 1, 1]],   // J
    [[0, 0, 1], [1, 1, 1]],   // L
    [[1, 1, 0], [0, 1, 1]],   // S
    [[0, 1, 1], [1, 1, 0]],   // Z
  ];
  const STEP = 1 / 120;

  return function (game) {
    const { cfg, rng, area } = game;
    const t = Object.assign({ dropMs: 800, wellW: 10, garbageBase: 4, nextN: 3, linesFactor: 1.0 }, cfg.typeExtra);
    const n = cfg.levels, L = game.level, p = (L - 1) / (n - 1);
    const drop = Math.max(120, Math.round(t.dropMs * (1 - 0.50 * p)));
    const garbage = Math.round(t.garbageBase * p);
    const linesTarget = Math.ceil((10 + 15 * p) * t.linesFactor);

    /* --- 井 + 关底垃圾行（1–2 洞位由 seed 掷点，§25） --- */
    const grid = [];
    for (let r = 0; r < ROWS; r++) grid.push(new Array(COLS).fill(0));
    for (let i = 0; i < garbage; i++) {
      const row = ROWS - 1 - i;
      const holes = rng() < 0.5 ? 1 : 2;
      const c1 = Math.floor(rng() * COLS);
      let c2 = -1;
      if (holes === 2) c2 = (c1 + 1 + Math.floor(rng() * (COLS - 1))) % COLS;
      for (let c = 0; c < COLS; c++) if (c !== c1 && c !== c2) grid[row][c] = 8;
    }

    /* --- 7-bag（seed 洗牌；袋耗尽即重洗，取序确定 ⇒ 序列可复现） --- */
    let bag = [];
    function nextKind() {
      if (!bag.length) {
        bag = [0, 1, 2, 3, 4, 5, 6];
        for (let i = 6; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp; }
      }
      return bag.pop();
    }
    const queue = [];
    while (queue.length < t.nextN + 1) queue.push(nextKind());

    /* --- 当前块 --- */
    let piece = null, dropT = 0, lockT = 0, onFloor = false;
    let lines = 0, score = 0, done = false, flashRows = [];
    let ptr = null;

    function fits(cells, x, y) {
      for (let i = 0; i < cells.length; i++) for (let j = 0; j < cells[i].length; j++) {
        if (!cells[i][j]) continue;
        const cx = x + j, cy = y + i;
        if (cx < 0 || cx >= COLS || cy >= ROWS) return false;
        if (cy >= 0 && grid[cy][cx]) return false;
      }
      return true;
    }
    function spawn() {
      const k = queue.shift();
      queue.push(nextKind());
      const cells = SHAPES[k].map(r => r.slice());
      const x = Math.floor((COLS - cells[0].length) / 2);
      piece = { k, cells, x, y: 0 };
      dropT = 0; lockT = 0; onFloor = false;
      if (!fits(cells, x, 0)) { done = true; game.lose(score); }   // 堆顶：新块无处生成（§25）
    }
    function tryMove(dx, dy) {
      if (!piece || done) return false;
      if (!fits(piece.cells, piece.x + dx, piece.y + dy)) return false;
      piece.x += dx; piece.y += dy;
      if (dy > 0) { dropT = 0; }
      lockT = 0;
      return true;
    }
    function rotate() {
      if (!piece || done) return;
      const c = piece.cells, h = c.length, w = c[0].length;
      const r = [];
      for (let j = 0; j < w; j++) { r.push([]); for (let i = h - 1; i >= 0; i--) r[j].push(c[i][j]); }
      for (const k of [0, -1, 1, -2, 2]) {                 // 简化踢墙
        if (fits(r, piece.x + k, piece.y)) { piece.cells = r; piece.x += k; lockT = 0; return; }
      }
    }
    function ghostY() {
      let y = piece.y;
      while (fits(piece.cells, piece.x, y + 1)) y++;
      return y;
    }
    function hardDrop() {
      if (!piece || done) return;
      piece.y = ghostY();
      lock();
    }
    function lock() {
      for (let i = 0; i < piece.cells.length; i++) for (let j = 0; j < piece.cells[i].length; j++) {
        if (!piece.cells[i][j]) continue;
        const cy = piece.y + i;
        if (cy < 0) { done = true; game.lose(score); return; }     // 锁定越顶=堆顶败
        grid[cy][piece.x + j] = piece.k + 1;
      }
      const keep = [];
      for (let r = 0; r < ROWS; r++) (grid[r].every(v => v) ? flashRows.push(r) : keep.push(grid[r]));
      const cleared = flashRows.length;
      for (let i = 0; i < cleared; i++) keep.unshift(new Array(COLS).fill(0));
      for (let r = 0; r < ROWS; r++) grid[r] = keep[r];
      if (cleared) {
        lines += cleared;
        score += [0, 100, 300, 500, 800][Math.min(4, cleared)];    // 按次计（§25 计分）
      }
      piece = null;
      if (lines >= linesTarget) { done = true; game.win(score, { s2: 150 * linesTarget, s3: 220 * linesTarget }); return; }
      spawn();
    }

    function step() {
      if (done) return;
      if (!piece) return;
      dropT += STEP * 1000;
      if (dropT >= drop) {
        dropT = 0;
        if (!tryMove(0, 1)) onFloor = true;
      }
      if (onFloor) {
        if (fits(piece.cells, piece.x, piece.y + 1)) { onFloor = false; }
        else {
          lockT += STEP;
          if (lockT >= 0.55) lock();
        }
      }
    }

    spawn();

    return {
      startLevel() { game.setHud([{ t: `/${linesTarget}行`, v: 0 }, { t: '分', v: 0 }, { t: '下块', v: queue.length }]); },
      update(dt) {
        let acc = dt;
        while (acc >= STEP) { acc -= STEP; step(); if (done) break; }
        if (flashRows.length) flashRows = [];
        game.setHud([
          { t: `/${linesTarget}行`, v: lines },
          { t: '分', v: score },
          { t: '垃圾', v: garbage },
        ]);
      },
      onDown(x, y) { ptr = { x, y, lx: x, ly: y, accX: 0, dispX: 0, dispY: 0 }; },
      onMove(x, y) {
        if (!ptr || done || !piece) return;
        const dx = x - ptr.lx, dy = y - ptr.ly;
        ptr.lx = x; ptr.ly = y;
        ptr.dispX += dx; ptr.dispY += dy;
        ptr.accX += dx;
        while (ptr.accX >= CELL) { tryMove(1, 0); ptr.accX -= CELL; }     // 横拖：每格移动
        while (ptr.accX <= -CELL) { tryMove(-1, 0); ptr.accX += CELL; }
        if (dy > 44) { hardDrop(); ptr = null; return; }                  // 快速下滑=硬降（fling）
        if (dy > 0) {
          ptr.accY = (ptr.accY || 0) + dy;
          while (ptr.accY >= CELL * 1.2) { tryMove(0, 1); ptr.accY -= CELL * 1.2; }   // 下拖=软降
        }
      },
      onUp(x, y) {
        if (!ptr || done || !piece) { ptr = null; return; }
        const dx = ptr.dispX, dy = ptr.dispY;
        ptr = null;
        if (Math.abs(dx) < 24 && Math.abs(dy) < 24) { rotate(); return; } // 点按=旋转（备选，§25）
        if (dy < -24 && Math.abs(dy) >= Math.abs(dx)) { rotate(); return; }   // 上滑=旋转
        if (dy > 24 && Math.abs(dy) >= Math.abs(dx)) { tryMove(0, 1); return; } // 下滑=软降一格
        if (Math.abs(dx) >= 24) tryMove(dx > 0 ? 1 : -1, 0);              // 短横滑=移一格
      },
      render(g) {
        const wx = (area.w - COLS * CELL) / 2, wy = area.y + 26;
        /* 井框 */
        g.fillStyle = '#141a2b'; g.fillRect(wx - 5, wy - 5, COLS * CELL + 10, ROWS * CELL + 10);
        g.strokeStyle = '#2c3a5c'; g.lineWidth = 2; g.strokeRect(wx - 5, wy - 5, COLS * CELL + 10, ROWS * CELL + 10);
        /* 已落格 */
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
          const v = grid[r][c];
          if (!v) continue;
          g.fillStyle = COLORS[v];
          G.roundRect(g, wx + c * CELL + 1, wy + r * CELL + 1, CELL - 2, CELL - 2, 3); g.fill();
        }
        if (piece && !done) {
          /* 落点投影 */
          const gy = ghostY();
          g.globalAlpha = 0.22;
          g.fillStyle = COLORS[piece.k + 1];
          for (let i = 0; i < piece.cells.length; i++) for (let j = 0; j < piece.cells[i].length; j++) {
            if (!piece.cells[i][j]) continue;
            const cy = gy + i;
            if (cy >= 0) G.roundRect(g, wx + (piece.x + j) * CELL + 1, wy + cy * CELL + 1, CELL - 2, CELL - 2, 3), g.fill();
          }
          g.globalAlpha = 1;
          /* 当前块（越顶行画在井上方半透明） */
          g.fillStyle = COLORS[piece.k + 1];
          for (let i = 0; i < piece.cells.length; i++) for (let j = 0; j < piece.cells[i].length; j++) {
            if (!piece.cells[i][j]) continue;
            const cy = piece.y + i;
            g.globalAlpha = cy < 0 ? 0.45 : 1;
            G.roundRect(g, wx + (piece.x + j) * CELL + 1, wy + cy * CELL + 1, CELL - 2, CELL - 2, 3); g.fill();
          }
          g.globalAlpha = 1;
        }
        /* next 预览（屏下拇指区上方，资源 nextN 块） */
        g.fillStyle = '#8b94a7'; g.font = G.FONT(11, 500); g.textAlign = 'left'; g.textBaseline = 'middle';
        g.fillText('NEXT', wx, wy + ROWS * CELL + 24);
        for (let q = 0; q < Math.min(t.nextN, queue.length); q++) {
          const cells = SHAPES[queue[q]];
          const ox = wx + 52 + q * 56, oy = wy + ROWS * CELL + 14;
          g.fillStyle = COLORS[queue[q] + 1];
          for (let i = 0; i < cells.length; i++) for (let j = 0; j < cells[i].length; j++) {
            if (!cells[i][j]) continue;
            G.roundRect(g, ox + j * 11, oy + i * 11, 10, 10, 2); g.fill();
          }
        }
      },
      __state() {
        return {
          drop, garbage, linesTarget, nextN: t.nextN, lines, score, done,
          grid: grid.map(r => r.join('')).join('|'),
          piece: piece && { k: piece.k, x: piece.x, y: piece.y, cells: piece.cells.map(r => r.join('')).join('/') },
          queue: queue.join(','), bag: bag.join(''),
          lockT: +lockT.toFixed(3), onFloor,
        };
      },
    };
  };
})();

</script>
<script>
G.boot(CONFIG, BlockDropEngine);
</script>
